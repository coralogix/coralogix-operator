apiVersion: coralogix.com/v1alpha1
kind: Connector
metadata:
  labels:
    app.kubernetes.io/name: coralogix-operator
    app.kubernetes.io/instance: connector-sample
    app.kubernetes.io/part-of: coralogix-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: coralogix-operator
  name: pager-duty-with-template-secret-sample
spec:
  name: pager-duty-with-template-secret-sample
  description: PagerDuty connector using Kubernetes Secrets for the integration key and its override template
  type: pagerDuty
  connectorConfig:
    fields:
      - fieldName: integrationKey
        secretKeyRef:
          name: example-credentials
          key: integration-key
  configOverrides:
    - entityType: alerts
      fields:
        # Use templateSecretKeyRef when the template holds a credential.
        - fieldName: integrationKey
          templateSecretKeyRef:
            name: example-credentials
            key: integration-key-template
---
apiVersion: v1
kind: Secret
metadata:
  name: example-credentials
type: Opaque
stringData:
  integration-key: example-value
  integration-key-template: example-value
