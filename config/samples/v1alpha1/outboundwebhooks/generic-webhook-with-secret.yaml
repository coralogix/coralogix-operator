apiVersion: coralogix.com/v1alpha1
kind: OutboundWebhook
metadata:
  name: generic-webhook-with-secret
spec:
  name: generic-webhook-with-secret
  outboundWebhookType:
    genericWebhook:
      method: Post
      urlSecretKeyRef:
        name: webhook-credentials
        key: url
      headersFromSecret:
        Authorization:
          name: webhook-credentials
          key: authorization
