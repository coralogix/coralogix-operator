apiVersion: coralogix.com/v1alpha1
kind: RuleGroup
metadata:
  creationTimestamp: null
  name: vac-manual-parse
spec:
  active: true
  applications:
  - nginx
  description: 'Manual VAC test: parse'
  name: vac-manual-parse
  order: 1
  subgroups:
  - active: true
    order: 1
    rules:
    - active: true
      name: parse-rule
      parse:
        destinationField: text
        regex: (?P<status>\d{3})
        sourceField: text
