---
apiVersion: coralogix.com/v1alpha1
kind: RuleGroup
metadata:
  creationTimestamp: null
  name: vac-manual-parsing-demo
spec:
  active: true
  applications:
  - nginx
  description: 'Manual VAC test: parsing rules demo'
  name: vac-manual-parsing-demo
  order: 1
  severities:
  - Warning
  subgroups:
  - active: true
    order: 1
    rules:
    - active: true
      description: Extract HTTP status
      name: parse-status
      parse:
        destinationField: text
        regex: (?P<status>\d{3})
        sourceField: text
    - active: true
      jsonExtract:
        destinationField: Category
        jsonKey: worker
      name: worker-to-category
    - active: true
      block:
        blockingAllMatchingBlocks: true
        regex: health
        sourceField: text
      name: block-health
  - active: true
    order: 2
    rules:
    - active: true
      extractTimestamp:
        fieldFormatStandard: Strftime
        sourceField: text
        timeFormat: '%Y-%m-%dT%H:%M:%S.%f%z'
      name: extract-ts
  subsystems:
  - api
status: {}

