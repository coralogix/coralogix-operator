apiVersion: coralogix.com/v1alpha1
kind: TCOLogsPolicies
metadata:
  labels:
    app.kubernetes.io/name: coralogix-operator
    app.kubernetes.io/instance: tco-logs-policies-sample
    app.kubernetes.io/part-of: coralogix-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: coralogix-operator
  name: tco-logs-policies-sample
spec:
  policies:
    - name: first policy
      priority: high
      severities:
      - critical
      - error
      applications:
        names:
          - prod
        ruleType: is
      subsystems:
        names:
          - mobile
        ruleType: is
      archiveRetention:
        backendRef:
          name: Default
    - name: second policy
      priority: low
      severities:
      - warning
      applications:
        names:
          - dev
        ruleType: start_with
      subsystems:
        names:
          - test
        ruleType: is_not
    - name: third policy
      priority: medium
      disabled: true
      severities:
      - info
      applications:
        names:
          - prod
        ruleType: includes
      subsystems:
        names:
          - mobile
        ruleType: start_with
    - name: dataset routing policy
      priority: medium
      severities:
      - info
      targets:
        - dataspace: default
          dataset: logs
          priority: high
        # Routes 80% of this dataset's daily quota at medium, and everything
        # past that at low. The target priority is the fallback once the tiers
        # are consumed, so it must be at least as restrictive as the last tier.
        - dataspace: default
          dataset: audit_logs
          priority: low
          priorityOverride:
            quotaBased:
              usageTiers:
                - dailyQuotaPercentage: "80"
                  priority: medium
