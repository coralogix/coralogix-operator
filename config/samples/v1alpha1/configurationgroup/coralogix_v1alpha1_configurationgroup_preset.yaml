apiVersion: coralogix.com/v1alpha1
kind: ConfigurationGroup
metadata:
  name: configuration-group-preset-sample
spec:
  name: production-k8s-collectors
  description: Kubernetes collectors generated from the OTel integration template.
  tags:
    - production
  family:
    active: true
    description: Kubernetes preset family
    # The API rejects unsupported chart versions; use a currently supported chartVersion.
    # integrationVersion can be omitted to use the default for the chart version.
    preset:
      chartName: otelIntegration
      chartVersion: "0.0.289"
      metadata:
        ClusterName: production
        KubernetesRunningOn: openshift
        PrivateLinkEnabled: "false"
      observabilityFeatures:
        apm:
          enabled: true
          ebpf: false
          span_metrics:
            enabled: true
            histogram_buckets: []
            transform_statements: []
          sampling: {}
          profiling:
            enabled: false
        logs:
          enabled: false
        kubernetes_events: true
        reduce_resources_attributes: true
        metrics:
          host:
            enabled: false
          kubelet: false
          cluster: false
          kubernetes_extra:
            enabled: false
            scrape_all: false
          collector: false
          statsd: false
          target_allocator: false
        resource_catalog: false
        fleet_management:
          enabled: false
          remote_config: false
        coralogix_operator: false
