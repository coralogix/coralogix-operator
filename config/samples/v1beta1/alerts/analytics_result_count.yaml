# Analytics alerts are in preview.
apiVersion: coralogix.com/v1beta1
kind: Alert
metadata:
  labels:
    app.kubernetes.io/name: alert
    app.kubernetes.io/instance: alert-sample
    app.kubernetes.io/part-of: coralogix-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: coralogix-operator
  name: analytics-result-count
spec:
  name: analytics-result-count alert example
  description: alert from k8s operator
  priority: p3
  # groupByKeys must be columns returned by the query.
  groupByKeys:
    - applicationname
  alertType:
    analyticsResultCount:
      dataprimeQuery:
        query: source logs | filter $m.severity == Severity.ERROR | groupby $l.applicationname aggregate count() as errors
      timeframeMinutes: 15
      # Optional. How often the query is evaluated, in minutes. Must not exceed timeframeMinutes.
      # When omitted, the API uses min(10, timeframeMinutes). Removing the line resets the period to that default.
      evaluationPeriodMinutes: 5
      evaluationDelayMs: 60000
      noDataPolicy:
        state: alerting
        autoRetireSeconds: 3600
      # Optional. Without rules, the alert fires at its priority on any result row.
      # operator defaults to moreThan. A rule without override fires at the alert priority.
      operator: moreThanOrEquals
      rules:
        - condition:
            countThreshold: 3
            expression: errors > 100
          override:
            priority: p1
        - condition:
            countThreshold: 10
