              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TCOLogsPoliciesSpec defines the desired state of a TCOLogsPolicies.
            properties:
              policies:
                description: List of policies.
                items:
                  description: TCOLogsPoliciesPolicy is the Policy object of the API.
                  properties:
                    applications:
                      description: Rule.
                      properties:
                        names:
                          description: |-
                            The value(s) to match. For IS and IS_NOT rules, up to 50 comma-separated values. The service stores the values in lower case.
                            The API holds the values as one string, joined by ",".
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        ruleType:
                          description: Rule type id.
                          enum:
                          - is
                          - is_not
                          - start_with
                          - includes
                          type: string
                      required:
                      - names
                      - ruleType
                      type: object
                    archiveRetention:
                      description: |-
                        Archive retention.
                        It refers to a ArchiveRetention by backend id, backend name, or custom resource.
                      properties:
                        backendRef:
                          description: Reference to the retention policy
                          properties:
                            id:
                              description: ID of the policy.
                              pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
