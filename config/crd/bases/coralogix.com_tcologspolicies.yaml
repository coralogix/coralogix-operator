                                properties:
                                  dailyQuotaPercentage:
                                    anyOf:
                                    - type: integer
                                    - type: string
                                    description: The daily quota percentage. Must
                                      be between 0 and 100.
                                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
