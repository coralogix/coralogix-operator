                          dataset:
                            description: The dataset.
                            minLength: 1
                            type: string
                          dataspace:
                            description: 'The dataspace. Only `default` is supported,
                              in any letter case; the service rejects another value
                              with `400`. A log policy target reads back with the
                              value as sent, and with `default` when it is omitted.
                              Span and RUM policies reject targets in a request: a
                              span policy reads back with one `spans` target in `default`,
                              and a RUM policy with none.'
                            maxLength: 50
                            type: string
                          priority:
                            description: The base priority for the target.
                            enum:
                            - block
                            - high
                            - medium
                            - low
                            type: string
                          priorityOverride:
                            description: Optional quota-based tiered priority override
