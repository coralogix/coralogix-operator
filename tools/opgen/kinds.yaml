# The kinds that opgen generates. Each entry names the custom resource kind and the OpenAPI
# component of its API resource. A kind with handwritten generator input has a directory
# kinds/<lower-case kind>.
kinds:
  - kind: Events2Metric
    resource: E2M
  - kind: GlobalRouter
    resource: GlobalRouter
  - kind: Preset
    resource: Preset
  - kind: View
    resource: View
  - kind: ViewFolder
    resource: ViewFolder
  - kind: Dashboard
    resource: Dashboard
