---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "coralogixOperator.fullname" . }}
rules:
  - apiGroups:
      - coralogix.com
    resources:
      - handwrittens
    verbs:
      - get
  # BEGIN generated kinds
  - apiGroups:
      - coralogix.com
    resources:
      - bodyidthings
      - contentthings
      - hookdeletethings
      - hookthings
      - patchthings
      - refthings
      - things
      - wrappedthings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coralogix.com
    resources:
      - bodyidthings/finalizers
      - contentthings/finalizers
      - hookdeletethings/finalizers
      - hookthings/finalizers
      - patchthings/finalizers
      - refthings/finalizers
      - things/finalizers
      - wrappedthings/finalizers
    verbs:
      - update
  - apiGroups:
      - coralogix.com
    resources:
      - bodyidthings/status
      - contentthings/status
      - hookdeletethings/status
      - hookthings/status
      - patchthings/status
      - refthings/status
      - things/status
      - wrappedthings/status
    verbs:
      - get
      - patch
      - update
  # END generated kinds
