---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "coralogixOperator.fullname" . }}
rules:
  - apiGroups:
      - coralogix.com
    resources:
      - handwrittens
    verbs:
      - get
  # BEGIN generated kinds
  - apiGroups:
      - coralogix.com
    resources:
      - batchthings
      - bodyidthings
      - contentthings
      - hookdeletethings
      - hookthings
      - maskthings
      - patchthings
      - refthings
      - secretthings
      - settingthings
      - things
      - thingpolicies
      - wrappedthings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coralogix.com
    resources:
      - batchthings/finalizers
      - bodyidthings/finalizers
      - contentthings/finalizers
      - hookdeletethings/finalizers
      - hookthings/finalizers
      - maskthings/finalizers
      - patchthings/finalizers
      - refthings/finalizers
      - secretthings/finalizers
      - settingthings/finalizers
      - things/finalizers
      - thingpolicies/finalizers
      - wrappedthings/finalizers
    verbs:
      - update
  - apiGroups:
      - coralogix.com
    resources:
      - batchthings/status
      - bodyidthings/status
      - contentthings/status
      - hookdeletethings/status
      - hookthings/status
      - maskthings/status
      - patchthings/status
      - refthings/status
      - secretthings/status
      - settingthings/status
      - things/status
      - thingpolicies/status
      - wrappedthings/status
    verbs:
      - get
      - patch
      - update
  # END generated kinds
