                        type: string
                    required:
                    - topic
                    type: object
                type: object
                x-kubernetes-validations:
                - message: Exactly one of http, queue must be set
                  rule: '(has(self.http) ? 1 : 0) + (has(self.queue) ? 1 : 0) == 1'
              description:
                description: An optional description.
                type: string
              destinations:
                description: Ordered destination URLs.
                items:
                  pattern: ^https://[a-z.]+$
                  type: string
                maxItems: 10
                type: array
              enabled:
                description: Whether the thing is enabled. The server sets true when
                  it is omitted.
                type: boolean
              items:
