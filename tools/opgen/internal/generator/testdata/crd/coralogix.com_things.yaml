---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: things.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: Thing
    listKind: ThingList
    plural: things
    singular: thing
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Thing is the Schema for the things API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ThingSpec defines the desired state of a Thing.
            properties:
              config:
                description: ThingConfig is the ThingConfig object of the API.
                properties:
                  http:
                    description: ThingHttpThingConfig is the HttpThingConfig object
                      of the API.
                    properties:
                      endpoint:
                        description: The endpoint URL.
                        minLength: 1
                        type: string
                    required:
                    - endpoint
                    type: object
                  queue:
                    description: ThingQueueThingConfig is the QueueThingConfig object
