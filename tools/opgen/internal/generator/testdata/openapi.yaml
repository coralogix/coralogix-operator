      properties:
        keyId: {type: string, minLength: 1}
    GetKeyThingResponse:
      type: object
      required: [keyInfo]
      properties:
        keyInfo: {$ref: '#/components/schemas/KeyThing'}
    KeyThing:
      type: object
      required: [id, name, enabled, keyPermissions]
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        note: {type: string, x-coralogix-presence: true}
        enabled: {type: boolean}
        keyPermissions: {$ref: '#/components/schemas/KeyThing.KeyPermissions'}
    KeyThing.KeyPermissions:
      type: object
      properties:
        presets: {type: array, items: {$ref: '#/components/schemas/KeyThingPreset'}}
