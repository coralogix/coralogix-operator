# Synthetic contracts of the golden tests.
# Thing: a full replace (PUT). Required and optional scalars, an immutable enum, a required oneOf,
# a nested object with an immutable and a computed field, an ordered list of objects, a list with
# a pattern, a set, a map, a 64-bit number, a server default, and computed fields.
# PatchThing: a PATCH with updateMask, an immutable enum, an optional oneOf, and a server default.
# BodyIDThing: a kind that users already have, as the view folders API has it. Replace is a PUT on
# the Create path with the id in the body (api.updateIDInBody), and the released kind has no
# contract limits (validators.inferred: false).
# HookThing: a kind that users already have, with every hook except delete and with extra status
# fields. Its Replace returns an empty object. HookDeleteThing: the delete hook, which replaces the
# generated DELETE; its Replace returns the resource.
# WrappedThing: a kind that users already have. Its request wrapper holds a request component of its
# own: title is heading in the requests, and note is extra.note (requestAs).
# ContentThing: a kind that users already have, with the content key: the CR holds the resource as
# JSON text. Create answers only the id (api.createResponseOnlyIDProperty). The request wrapper
# has the resource beside a policy that the CR holds (requestValues source field) and a flag that
# it never sends (omit). It has the adopt hook and a handwritten spec field (the spec key).
# RefThing: a kind that users already have, with a required and an optional id of a Thing. Its
# behavior-overrides file makes both ids references (the ref key).
openapi: 3.1.0
info:
  title: Synthetic things API
  version: 1.0.0
paths:
  /things:
    post:
      tags: [Things Service]
      operationId: ThingsService_CreateThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateThingRequest
              type: object
              required: [name, kind, config]
              properties:
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                description: {type: string, x-coralogix-presence: true}
                enabled: {type: boolean, default: true, x-coralogix-presence: true}
                kind: {$ref: '#/components/schemas/ThingKind'}
                priority: {$ref: '#/components/schemas/ThingPriority'}
                quota: {type: string, format: int64, x-coralogix-presence: true}
                ratio: {type: number, format: float, x-coralogix-presence: true}
                buckets:
                  type: array
                  maxItems: 8
                  items: {type: number, format: float}
                config: {$ref: '#/components/schemas/ThingConfig'}
                settings: {$ref: '#/components/schemas/ThingSettingsCreate'}
                items:
                  type: array
                  items: {$ref: '#/components/schemas/ThingItem'}
                destinations:
                  type: array
                  maxItems: 10
                  items: {type: string, pattern: '^https://[a-z.]+$'}
                tags:
                  type: array
                  uniqueItems: true
                  x-coralogix-collection: set
                  items: {type: string, minLength: 1}
                labels:
                  type: object
                  additionalProperties: {type: string, minLength: 1, maxLength: 63}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thing'}
  /things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Things Service]
      operationId: ThingsService_GetThing
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thing'}
    put:
      tags: [Things Service]
      operationId: ThingsService_ReplaceThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceThingRequest
              type: object
              required: [name, config]
              properties:
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                description: {type: string, x-coralogix-presence: true}
                enabled: {type: boolean, default: true, x-coralogix-presence: true}
                priority: {$ref: '#/components/schemas/ThingPriority'}
                quota: {type: string, format: int64, x-coralogix-presence: true}
                ratio: {type: number, format: float, x-coralogix-presence: true}
                buckets:
                  type: array
                  maxItems: 8
                  items: {type: number, format: float}
                config: {$ref: '#/components/schemas/ThingConfig'}
                settings: {$ref: '#/components/schemas/ThingSettingsUpdate'}
                items:
                  type: array
                  items: {$ref: '#/components/schemas/ThingItem'}
                destinations:
                  type: array
                  maxItems: 10
                  items: {type: string, pattern: '^https://[a-z.]+$'}
                tags:
                  type: array
                  uniqueItems: true
                  x-coralogix-collection: set
                  items: {type: string, minLength: 1}
                labels:
                  type: object
                  additionalProperties: {type: string, minLength: 1, maxLength: 63}
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thing'}
    delete:
      tags: [Things Service]
      operationId: ThingsService_DeleteThing
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {type: object}
  /patch-things:
    post:
      tags: [Patch Things Service]
      operationId: PatchThingsService_CreatePatchThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreatePatchThingRequest
              type: object
              required: [name, kind]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
                description: {type: string, x-coralogix-presence: true}
                enabled: {type: boolean, default: true, x-coralogix-presence: true}
                kind: {$ref: '#/components/schemas/PatchThingKind'}
                target: {$ref: '#/components/schemas/PatchThingTarget'}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatchThing'}
  /patch-things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Patch Things Service]
      operationId: PatchThingsService_GetPatchThing
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatchThing'}
    patch:
      tags: [Patch Things Service]
      operationId: PatchThingsService_UpdatePatchThing
      parameters:
        - name: updateMask
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-z][A-Za-z0-9]*(\.[a-z][A-Za-z0-9]*)*(,[a-z][A-Za-z0-9]*(\.[a-z][A-Za-z0-9]*)*)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: UpdatePatchThingRequest
              type: object
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
                description: {type: string, x-coralogix-presence: true}
                enabled: {type: boolean, default: true, x-coralogix-presence: true}
                target: {$ref: '#/components/schemas/PatchThingTarget'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatchThing'}
    delete:
      tags: [Patch Things Service]
      operationId: PatchThingsService_DeletePatchThing
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {type: object}
  /ref-things:
    post:
      tags: [Ref Things Service]
      operationId: RefThingsService_CreateRefThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateRefThingRequest
              type: object
              required: [name, thingId]
              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
                thingId: {type: string, minLength: 1, x-coralogix-presence: true}
                parentId: {type: string, x-coralogix-presence: true}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefThing'}
  /ref-things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Ref Things Service]
      operationId: RefThingsService_GetRefThing
      responses:
