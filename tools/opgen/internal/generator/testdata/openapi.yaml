      properties:
        id: {type: string, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true, description: The name.}
        limit: {type: integer, format: int32, minimum: 1, maximum: 5, x-coralogix-presence: true}
    HookDeleteThing:
      type: object
      required: [id, name]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true, description: The name.}
        limit: {type: integer, format: int32, minimum: 1, maximum: 5, x-coralogix-presence: true}
    GetThingPoliciesResponse:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ThingPolicy'}
    OverwriteThingPoliciesResponse:
