        item: {$ref: '#/components/schemas/CreateThingPolicyItem'}
        rules: {$ref: '#/components/schemas/ThingPolicyRules'}
    CreateThingPolicyItem:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 50, x-coralogix-presence: true}
        disabled: {type: boolean}
        tags: {type: string, maxLength: 200, x-coralogix-presence: true}
        level: {$ref: '#/components/schemas/ThingPolicyLevel'}
