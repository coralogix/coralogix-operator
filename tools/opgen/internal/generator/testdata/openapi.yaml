# Synthetic contracts of the golden tests.
# ArmThing: a kind that users already have, shaped like the outgoing webhooks API. The arm of a root
# oneOf selects its type, and the URL sits beside the arms (inArms shows it in each arm). The token of
# an arm and its header values can come from a Secret (secretRef). One arm is an empty object.
# Thing: a full replace (PUT). Required and optional scalars, an immutable enum, a required oneOf,
# a nested object with an immutable and a computed field, an ordered list of objects, a list with
# a pattern, a set, a map, a 64-bit number, a server default, and computed fields.
# PatchThing: a PATCH with updateMask, an immutable enum, an optional oneOf, and a server default.
# BodyIDThing: a kind that users already have, as the view folders API has it. Replace is a PUT on
# the Create path with the id in the body (api.updateIDInBody), and the released kind has no
# contract limits (validators.inferred: false).
# HookThing: a kind that users already have, with every hook except delete and with extra status
# fields. Its Replace returns an empty object. HookDeleteThing: the delete hook, which replaces the
# generated DELETE; its Replace returns the resource.
# WrappedThing: a kind that users already have. Its request wrapper holds a request component of its
# own: title is heading in the requests, and note is extra.note (requestAs).
# ContentThing: a kind that users already have, with the content key: the CR holds the resource as
# JSON text. Create answers only the id (api.createResponseOnlyIDProperty). The request wrapper
# has the resource beside a policy that the CR holds (requestValues source field) and a flag that
# it never sends (omit). It has the adopt hook and a handwritten spec field (the spec key).
# RefThing: a kind that users already have, with a required and an optional id of a Thing. Its
# behavior-overrides file makes both ids references (the ref key).
# ThingPolicies: an overwrite resource (api.overwrite), as the TCO policies API has it. One PUT
# replaces the whole list, and Delete sends it empty. A written item holds its fields in "item"
# (types.<Component>.requestWrapper), next to its rules, an arm of a oneOf of the response that the
# CR shows inline. The response has the other arm too, which no request sends. Its enabled is
# disabled in the request, and its tags are one string of comma-separated values (joinedBy). Its
# level is an enum, so the e2e test has a coverage step.
# MaskThing: a kind that users already have, with a PATCH whose API rejects the bare path of its
# required rule object (api.updateMask.nested). The rule has plain fields and a oneOf that
# requires one arm, so the mask names rule.enabled, rule.note, and the arm that the CR sets.
# SettingThing: a singleton that a GET reads and a POST sets, as the archive target API has it. The
# API cannot remove it (api.operations with delete: none). Get nests isActive and level in spec,
# which the POST sends at the top level (inline on the resource). Get has an item or an otherItem,
# and the POST sends only an item (otherItem is skipped).
# BatchThing: a kind that users already have, as the team scopes API has it. Get takes the id in a
# list of ids in its query and answers a list of the resource (api.getByIDs). Replace is a PUT on
# the Create path with the id in the body, and Create and Replace wrap the resource in "thing".
# ListThing: a kind that users already have, as the AI custom evaluations API has it. No operation
# reads one ListThing by its id: Get is the List (api.getFromList). Get nests note and level in
# settings, an optional $ref with a description of its own, which Create and Update send at the top
# level (inline, with required: true on the line). Update is a PATCH.
# KeyThing: a kind that users already have, as the API keys service has it. Create answers only the
# id. Update is a PUT that keeps what its body omits, names the name newName, and takes enabled as
# isEnabled, which Create cannot send (updateAs, updateDefault). Get nests the lists in
# keyPermissions, which Create nests too (inline, requestAs), and Update holds each list in a
# one-property wrapper (unwrap). Get holds each preset as an object with a name, and the requests
# send the names (itemName).
openapi: 3.1.0
