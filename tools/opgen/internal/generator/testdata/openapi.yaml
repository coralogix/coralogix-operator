              properties:
                name: {type: string, minLength: 1, x-coralogix-presence: true}
                thingId: {type: string, minLength: 1, x-coralogix-presence: true}
                parentId: {type: string, x-coralogix-presence: true}
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefThing'}
    delete:
      tags: [Ref Things Service]
      operationId: RefThingsService_DeleteRefThing
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {type: object}
  /body-id-things:
    post:
      tags: [Body ID Things Service]
      operationId: BodyIDThingsService_CreateBodyIDThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateBodyIDThingRequest
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                limit: {type: integer, format: int32, minimum: 1, maximum: 10, x-coralogix-presence: true}
                mode: {$ref: '#/components/schemas/BodyIDThingMode'}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyIDThing'}
    put:
      tags: [Body ID Things Service]
      operationId: BodyIDThingsService_ReplaceBodyIDThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: BodyIDThing
              type: object
              required: [id, name]
              properties:
                id: {type: string, minLength: 1, x-coralogix-presence: true}
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                limit: {type: integer, format: int32, minimum: 1, maximum: 10, x-coralogix-presence: true}
                mode: {$ref: '#/components/schemas/BodyIDThingMode'}
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyIDThing'}
  /body-id-things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Body ID Things Service]
      operationId: BodyIDThingsService_GetBodyIDThing
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BodyIDThing'}
    delete:
      tags: [Body ID Things Service]
      operationId: BodyIDThingsService_DeleteBodyIDThing
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {type: object}
  /wrapped-things:
    post:
      tags: [Wrapped Things Service]
      operationId: WrappedThingsService_CreateWrappedThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateWrappedThingRequest
              type: object
              required: [item]
              properties:
                item: {$ref: '#/components/schemas/WrappedThingBody'}
                label: {type: string}
                requestId: {type: string}
      responses:
        '200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/WrappedThingResponse'}}}}
    put:
      tags: [Wrapped Things Service]
      operationId: WrappedThingsService_ReplaceWrappedThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceWrappedThingRequest
              type: object
              required: [item]
              properties:
                item: {$ref: '#/components/schemas/WrappedThingBody'}
                id: {type: string}
                label: {type: string}
                requestId: {type: string}
      responses:
        '200': {description: Replaced, content: {application/json: {schema: {$ref: '#/components/schemas/WrappedThingResponse'}}}}
  /wrapped-things/{item_id}:
    parameters:
      - {name: item_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Wrapped Things Service]
      operationId: WrappedThingsService_GetWrappedThing
      responses:
        '200': {description: Found, content: {application/json: {schema: {$ref: '#/components/schemas/WrappedThingResponse'}}}}
    delete:
      tags: [Wrapped Things Service]
      operationId: WrappedThingsService_DeleteWrappedThing
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {type: object}}}}
  /content-things:
    post:
      tags: [Content Things Service]
      operationId: ContentThingsService_CreateContentThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateContentThingRequest
              type: object
              required: [requestId, item]
              properties:
                item: {$ref: '#/components/schemas/ContentThing'}
                policy: {type: string, maxLength: 100, description: The access policy of the thing., x-coralogix-presence: true}
                locked: {type: boolean, x-coralogix-presence: true}
                requestId: {type: string, x-coralogix-presence: true}
      responses:
        '200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/CreateContentThingResponse'}}}}
    put:
      tags: [Content Things Service]
      operationId: ContentThingsService_ReplaceContentThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceContentThingRequest
              type: object
              required: [requestId]
              properties:
                item: {$ref: '#/components/schemas/ContentThing'}
                policy: {type: string, maxLength: 100, description: The access policy of the thing., x-coralogix-presence: true}
                locked: {type: boolean, x-coralogix-presence: true}
                requestId: {type: string, x-coralogix-presence: true}
      responses:
        '200': {description: Replaced, content: {application/json: {schema: {type: object}}}}
  /content-things/{thing_id}:
    parameters:
      - {name: thing_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Content Things Service]
      operationId: ContentThingsService_GetContentThing
      responses:
        '200': {description: Found, content: {application/json: {schema: {$ref: '#/components/schemas/GetContentThingResponse'}}}}
    delete:
      tags: [Content Things Service]
      operationId: ContentThingsService_DeleteContentThing
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {type: object}}}}
  /hook-things:
    post:
      tags: [Hook Things Service]
      operationId: HookThingsService_CreateHookThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateHookThingRequest
              type: object
              required:
                - name
              properties:
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                limit: {type: integer, format: int32, minimum: 1, maximum: 5, x-coralogix-presence: true}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HookThing'}
  /hook-things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Hook Things Service]
      operationId: HookThingsService_GetHookThing
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HookThing'}
    put:
      tags: [Hook Things Service]
      operationId: HookThingsService_ReplaceHookThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceHookThingRequest
              type: object
              required:
                - name
              properties:
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                limit: {type: integer, format: int32, minimum: 1, maximum: 5, x-coralogix-presence: true}
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: {type: object}
    delete:
      tags: [Hook Things Service]
      operationId: HookThingsService_DeleteHookThing
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: {type: object}
  /hook-delete-things:
    post:
      tags: [Hook Delete Things Service]
      operationId: HookDeleteThingsService_CreateHookDeleteThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: CreateHookDeleteThingRequest
              type: object
              required:
                - name
              properties:
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                limit: {type: integer, format: int32, minimum: 1, maximum: 5, x-coralogix-presence: true}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HookDeleteThing'}
  /hook-delete-things/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Hook Delete Things Service]
      operationId: HookDeleteThingsService_GetHookDeleteThing
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HookDeleteThing'}
    put:
      tags: [Hook Delete Things Service]
      operationId: HookDeleteThingsService_ReplaceHookDeleteThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: ReplaceHookDeleteThingRequest
              type: object
              required:
                - name
              properties:
                name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true}
                limit: {type: integer, format: int32, minimum: 1, maximum: 5, x-coralogix-presence: true}
      responses:
        '200':
