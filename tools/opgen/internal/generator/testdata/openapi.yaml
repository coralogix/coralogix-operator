components:
  schemas:
    ListThing:
      type: object
      properties:
        id: {type: string, minLength: 1}
        name: {type: string, minLength: 1, description: The name.}
        settings:
          allOf:
            - $ref: '#/components/schemas/ListThingSettings'
          description: The settings, which the requests send at the top level.
    ListThingSettings:
      type: object
      properties:
        note: {type: string, description: A note.}
        level: {type: integer, format: int64, description: The level.}
    GetListThingsResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ListThing'}
    CreateListThingResponse:
      type: object
      properties:
        item:
          allOf:
            - $ref: '#/components/schemas/ListThing'
          description: The new ListThing.
    UpdateListThingResponse:
      type: object
      properties:
        item:
          allOf:
            - $ref: '#/components/schemas/ListThing'
          description: The ListThing.
    BatchThing:
      type: object
      required: [id, name]
      properties:
        id: {type: string, minLength: 1, readOnly: true}
        name: {type: string, minLength: 1, description: The name.}
        note: {type: string, x-coralogix-presence: true}
    GetBatchThingsResponse:
      type: object
      required: [things]
      properties:
        things:
          type: array
          items: {$ref: '#/components/schemas/BatchThing'}
    CreateBatchThingResponse:
      type: object
      required: [thing]
      properties:
        thing: {$ref: '#/components/schemas/BatchThing'}
    ReplaceBatchThingResponse:
      type: object
      required: [thing]
      properties:
        thing: {$ref: '#/components/schemas/BatchThing'}
    GetSettingThingResponse:
      type: object
      required: [setting]
      properties:
        setting: {$ref: '#/components/schemas/SettingThing'}
    SetSettingThingResponse:
      type: object
      required: [setting]
      properties:
        setting: {$ref: '#/components/schemas/SettingThing'}
    SettingThing:
      type: object
      description: The one setting of the team.
      required: [spec]
      oneOf:
        - required: [item]
        - required: [otherItem]
      properties:
        item: {$ref: '#/components/schemas/SettingThingItem'}
        otherItem: {$ref: '#/components/schemas/SettingThingOtherItem'}
        spec: {$ref: '#/components/schemas/SettingThingSpec'}
    SettingThingSpec:
      type: object
      description: How the setting is used.
      properties:
        isActive: {type: boolean, description: Whether the setting is active.}
        level: {$ref: '#/components/schemas/SettingThingLevel'}
    SettingThingItem:
      type: object
      description: The bucket of the setting.
      required: [bucket]
      properties:
        bucket: {type: string, minLength: 3, description: Bucket name.}
        region: {type: string, description: Region.}
    SettingThingOtherItem:
      type: object
      description: A bucket of another provider, which this API does not set.
      properties:
        crn: {type: string, description: Bucket CRN.}
    SettingThingLevel:
      type: string
      description: Setting level.
      enum: [SETTING_THING_LEVEL_UNSPECIFIED, SETTING_THING_LEVEL_LOW, SETTING_THING_LEVEL_HIGH]
    Thing:
      type: object
      required: [id, name, enabled, kind, config, createTime]
      properties:
        id: {type: string, readOnly: true, description: The id that the server sets.}
        name: {type: string, minLength: 1, maxLength: 100, description: The display name.}
        description: {type: string, description: An optional description.}
        enabled: {type: boolean, description: Whether the thing is enabled. The server sets true when it is omitted.}
        kind:
          $ref: '#/components/schemas/ThingKind'
          description: The kind. It cannot change.
        priority: {$ref: '#/components/schemas/ThingPriority'}
        quota: {type: string, format: int64, description: "The quota, a 64-bit number."}
        ratio: {type: number, format: float, description: A fraction that the thing uses.}
        buckets:
          type: array
          maxItems: 8
          items: {type: number, format: float}
          description: Upper bounds of the buckets.
        config: {$ref: '#/components/schemas/ThingConfig'}
        settings: {$ref: '#/components/schemas/ThingSettings'}
        items:
          type: array
          items: {$ref: '#/components/schemas/ThingItem'}
          description: Ordered items.
        destinations:
          type: array
          maxItems: 10
          items: {type: string, pattern: '^https://[a-z.]+$'}
          description: Ordered destination URLs.
        tags:
          type: array
          uniqueItems: true
          x-coralogix-collection: set
          items: {type: string, minLength: 1}
          description: Unordered unique tags.
        labels:
          type: object
          additionalProperties: {type: string, minLength: 1, maxLength: 63}
          description: Labels by key.
        createTime: {type: string, format: date-time, readOnly: true, description: When the server created the thing.}
    ThingKind:
      type: string
      enum: [THING_KIND_UNSPECIFIED, THING_KIND_STANDARD, THING_KIND_ADVANCED]
    ThingPriority:
      type: string
      enum: [THING_PRIORITY_UNSPECIFIED, THING_PRIORITY_LOW, THING_PRIORITY_PAGER_DUTY_INCIDENTS]
    ThingConfig:
      type: object
      properties:
        http: {$ref: '#/components/schemas/HttpThingConfig'}
        queue: {$ref: '#/components/schemas/QueueThingConfig'}
      oneOf:
        - required: [http]
        - required: [queue]
    HttpThingConfig:
      type: object
      required: [endpoint]
      properties:
        endpoint: {type: string, minLength: 1, description: The endpoint URL.}
    QueueThingConfig:
      type: object
      required: [topic]
      properties:
        topic: {type: string, minLength: 1}
    ThingSettings:
      type: object
      required: [mode, revision]
      properties:
        mode: {type: string, minLength: 1, description: The processing mode.}
        retries: {type: integer, format: int32, minimum: 0, maximum: 10, description: How many times the thing retries.}
        region: {type: string, description: The region. It cannot change.}
        revision: {type: string, description: The revision that the server sets.}
    ThingSettingsCreate:
      type: object
      required: [mode]
      properties:
        mode: {type: string, minLength: 1}
        retries: {type: integer, format: int32, minimum: 0, maximum: 10, x-coralogix-presence: true}
        region: {type: string, x-coralogix-presence: true}
    ThingSettingsUpdate:
      type: object
      required: [mode]
      properties:
        mode: {type: string, minLength: 1}
        retries: {type: integer, format: int32, minimum: 0, maximum: 10, x-coralogix-presence: true}
    ThingItem:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1}
        weight: {type: integer, format: int32, minimum: 1}
    PatchThing:
      type: object
      required: [id, name, enabled, kind]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string, minLength: 1}
        description: {type: string}
        enabled: {type: boolean}
        kind: {$ref: '#/components/schemas/PatchThingKind'}
        target: {$ref: '#/components/schemas/PatchThingTarget'}
    MaskThing:
      type: object
      required: [id, name, rule]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string, minLength: 1}
        description: {type: string}
        rule: {$ref: '#/components/schemas/MaskThingRule'}
    MaskThingRule:
      type: object
      description: The rule. The API rejects the bare path rule in the update mask.
      properties:
        enabled: {type: boolean, x-coralogix-presence: true}
        note: {type: string, x-coralogix-presence: true}
        some: {$ref: '#/components/schemas/PatchThingSome'}
        prefix: {$ref: '#/components/schemas/PatchThingPrefix'}
      oneOf:
        - required: [some]
        - required: [prefix]
    PatchThingKind:
      type: string
      enum: [PATCH_THING_KIND_UNSPECIFIED, PATCH_THING_KIND_ALERTS, PATCH_THING_KIND_CASES]
    PatchThingTarget:
      type: object
      description: The things that it applies to. Without a target, it applies to every thing.
      properties:
        some: {$ref: '#/components/schemas/PatchThingSome'}
        prefix: {$ref: '#/components/schemas/PatchThingPrefix'}
      oneOf:
        - required: [some]
        - required: [prefix]
        - not:
            anyOf:
              - required: [some]
              - required: [prefix]
    PatchThingSome:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
    PatchThingPrefix:
      type: object
      required: [value]
      properties:
        value: {type: string, minLength: 1}
    RefThing:
      type: object
      required: [id, name, thingId]
      properties:
        id: {type: string, readOnly: true}
        name: {type: string, minLength: 1}
        thingId: {type: string, minLength: 1, description: The id of the Thing that it uses.}
        parentId: {type: string, description: The id of the parent Thing.}
    ArmThing:
      type: object
      required: [id, name]
      oneOf:
        - required: [hook]
        - required: [quiet]
      properties:
        id: {type: string, minLength: 1, x-coralogix-presence: true}
        name: {type: string, minLength: 1, x-coralogix-presence: true, description: The name.}
        url: {type: string, minLength: 0, x-coralogix-presence: true, description: The URL that the thing calls.}
        hook: {$ref: '#/components/schemas/ArmThingHook'}
        quiet: {$ref: '#/components/schemas/ArmThingQuiet'}
    ArmThingHook:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 1, description: The token of the hook.}
        note: {type: string, description: A note that is not a credential.}
        headers:
          type: object
          additionalProperties: {type: string}
          description: The headers of the call.
    ArmThingQuiet:
      type: object
      additionalProperties: false
      description: A thing that calls nothing.
    BodyIDThing:
      type: object
      required: [id, name]
      properties:
        id: {type: string, minLength: 1, x-coralogix-presence: true}
        name: {type: string, minLength: 1, maxLength: 100, x-coralogix-presence: true, description: The name.}
        limit: {type: integer, format: int32, minimum: 1, maximum: 10, x-coralogix-presence: true}
        mode: {$ref: '#/components/schemas/BodyIDThingMode'}
    BodyIDThingMode:
      type: string
      enum: [BODY_ID_THING_MODE_UNSPECIFIED, BODY_ID_THING_MODE_LOW, BODY_ID_THING_MODE_HIGH]
    WrappedThingResponse:
      type: object
      required: [item]
      properties:
        item: {$ref: '#/components/schemas/WrappedThing'}
    WrappedThingBody:
      type: object
      required: [name]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
        heading: {type: string, x-coralogix-presence: true}
        extra: {$ref: '#/components/schemas/WrappedThingExtra'}
    WrappedThingExtra:
      type: object
      properties:
        note: {type: string, x-coralogix-presence: true}
    WrappedThing:
      type: object
      required: [name]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, x-coralogix-presence: true}
        title: {type: string, x-coralogix-presence: true}
        note: {type: string, x-coralogix-presence: true}
    ContentThing:
      type: object
