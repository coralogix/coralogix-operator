resource: GlobalRouter
mode: existing
validators:
  inferred: false
api:
  requestWrapper: router
  updateIDInBody: true
  clientSetID: true
types:
  GlobalRouter:
    fields:
      entityType: {skip: true}
      description: {required: true}
  RoutingRule:
    fields:
      targets: {required: true}
  RoutingTarget:
    fields:
      connectorId: {name: connector, ref: {kind: Connector, type: NCRef}}
      presetId: {name: preset, ref: {kind: Preset, type: NCRef}}
enums:
  notification_center.EntityType:
    zero: unspecified
    rejectZero: true
    rejected: [{value: TEST_NOTIFICATIONS, reason: test reason}, {value: OLLY_SCHEDULED_TASKS, reason: test reason}]
