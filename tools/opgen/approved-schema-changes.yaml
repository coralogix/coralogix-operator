    reason: >-
      Same rule. The at-most-one CEL rule is now generated from the API oneOf. It accepts and
      rejects the same objects as the released rule; only the rule text and the message change.
  - kind: Events2Metric
    path: spec.versions.v1alpha1.schema.openAPIV3Schema.properties.spec.properties.query
    before: 23d21f98328f2ad1
    after: 6fecff6c6c133a51
    reason: >-
      Same rule. The exactly-one CEL rule is now generated from the API oneOf. It accepts and
      rejects the same objects as the released rule; only the rule text and the message change.
