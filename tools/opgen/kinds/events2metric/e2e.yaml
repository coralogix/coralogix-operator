# The live API needs an existing <namespace>/<dataset>; the released test leaves it unset.
omit: [dataSource]
substitutions:
  sample-name: '@{run}'                       # E2M names are unique per account
  sample-target-base-metric-name: '@{run}'    # metric names must not collide between runs
values:
  # The generated sample pairs aggType min with a samples arm. Use a consistent aggregation.
  metricFields.aggregations: [{aggType: min, enabled: true, targetMetricName: min_value, aggMetadata: {}}]
  # The live API rejects the generated placeholder as a source field; the contract allows any string.
  # The valid names depend on the query arm: request_count and status are logs fields, so the
  # sample uses the logs arm. The released e2e test uses the same names.
  metricFields.sourceField: request_count
  metricLabels.sourceField: status
  query: {logs: {lucene: 'status:200'}}
update:
  field: description
  value: Events2Metric updated by the e2e test
upgrade:
  from: '1.0'
  spec:
    name: '@{run}'
    description: Events2Metric created before the operator upgrade
    query: {logs: {lucene: 'status:200'}}
    metricLabels: [{targetLabel: status, sourceField: status}]
    metricFields:
      - targetBaseMetricName: '@{run}'
        sourceField: request_count
        # Chart 1.0 and 2.0 CRDs require exactly one of samples or histogram. The current CRD allows none,
        # but the old spec must pass the old CRD. A samples arm passes both.
        aggregations: [{aggType: min, enabled: true, targetMetricName: min_request_count, aggMetadata: {samples: {sampleType: min}}}]
  field: description
  value: Events2Metric updated after the operator upgrade
when:
  # The query arm decides which fields the metric can read, so each arm sets its own source fields.
  - match: {query: logs}
    set:
      query.logs.lucene: 'status:200'
      query.logs.severityFilters: [debug, verbose, info, warn, error, critical]
      metricFields.sourceField: request_count
      metricLabels.sourceField: status
  - match: {query: spans}
    set:
      metricFields.sourceField: duration
      metricLabels.sourceField: serviceName
  # Each aggregation of a metric field needs its own target metric name.
  - match: {metricFields.aggregations.aggType: min}
    set: {metricFields.aggregations.targetMetricName: min_value, metricFields.aggregations.aggMetadata: {}}
  - match: {metricFields.aggregations.aggType: max}
    set: {metricFields.aggregations.targetMetricName: max_value, metricFields.aggregations.aggMetadata: {}}
  - match: {metricFields.aggregations.aggType: count}
    set: {metricFields.aggregations.targetMetricName: count_value, metricFields.aggregations.aggMetadata: {}}
  - match: {metricFields.aggregations.aggType: avg}
    set: {metricFields.aggregations.targetMetricName: avg_value, metricFields.aggregations.aggMetadata: {}}
  - match: {metricFields.aggregations.aggType: sum}
    set: {metricFields.aggregations.targetMetricName: sum_value, metricFields.aggregations.aggMetadata: {}}
  - match: {metricFields.aggregations.aggType: histogram}
    set:
      metricFields.aggregations.targetMetricName: histogram_value
      metricFields.aggregations.aggMetadata: {histogram: {buckets: [1, 5, 10]}}
  - match: {metricFields.aggregations.aggType: samples}
    set:
      metricFields.aggregations.targetMetricName: samples_min_value
      metricFields.aggregations.aggMetadata: {samples: {sampleType: min}}
  - match: {metricFields.aggregations.aggType: samples}
    set:
      metricFields.aggregations.targetMetricName: samples_max_value
      metricFields.aggregations.aggMetadata: {samples: {sampleType: max}}
