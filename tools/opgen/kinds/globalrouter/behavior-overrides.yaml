resource: GlobalRouter
mode: existing
validators:
  inferred: true
  fields:
    spec.description: {inferred: false}
    spec.disabled: {inferred: false}
    spec.fallback: {inferred: false}
    spec.fallbackTargets: {inferred: false}
    spec.id: {inferred: false}
    spec.name: {inferred: false}
    spec.routingLabels.environment: {inferred: false}
    spec.routingLabels.service: {inferred: false}
    spec.routingLabels.team: {inferred: false}
    spec.rules: {inferred: false}
    spec.rules[].condition: {inferred: false}
    spec.rules[].entityType: {inferred: false}
    spec.rules[].name: {inferred: false}
    spec.rules[].targets: {inferred: false}
api:
  requestWrapper: router
  updateIDInBody: true
  clientSetID: true
types:
  GlobalRouter:
    fields:
      entityType: {skip: true}
      description: {required: true}
  RoutingRule:
    fields:
      targets: {required: true}
  RoutingTarget:
    fields:
      connectorId: {name: connector, ref: {kind: Connector, type: NCRef}}
      presetId: {name: preset, ref: {kind: Preset, type: NCRef}}
enums:
  notification_center.EntityType:
    zero: unspecified
    rejectZero: true
    values: [ALERTS, CASES]
    rejected: [TEST_NOTIFICATIONS, OLLY_SCHEDULED_TASKS]
