# The e2e values of TCOTracesPolicies that the contract cannot state.
#
# The API rejects a dpxlExpression next to services, actions, tags, applications, or subsystems, so
# the full spec leaves out dpxlExpression. A tier priority must be above the policy priority. The
# archive retention "Default" exists in every team.
omit: [policies.dpxlExpression]
values:
  policies.priority: low
  policies.tags.name: tags.env
  policies.archiveRetention: {backendRef: {name: Default}}
  policies.priorityOverride:
    quotaBased:
      usageTiers:
        - {dailyQuotaPercentage: 30, priority: high}
        - {dailyQuotaPercentage: 60, priority: medium}
# The spec that chart 0.5 accepts. Each write replaces every span policy of the team.
upgrade:
  from: '0.5'
  spec:
    policies:
      - name: '@{run}'
        priority: medium
  field: policies/0/description
  value: TCOTracesPolicies updated after the operator upgrade
