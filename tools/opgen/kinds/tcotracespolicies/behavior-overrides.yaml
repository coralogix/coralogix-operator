# Where TCOTracesPolicies differs from the API contract, because users already have it.
#
# A field with a line here keeps its released behavior. A field without a line follows the API
# contract.
resource: GetCompanyPoliciesResponse
mode: existing

validators:
  inferred: true
  fields:
    spec.policies[]#type:
      add:
        - '+kubebuilder:validation:XValidation:rule="!(has(self.dpxlExpression) && (has(self.services) || has(self.actions) || has(self.applications) || has(self.subsystems) || (has(self.tags) && size(self.tags) > 0)))",message="dpxlExpression is mutually exclusive with services, actions, tags, applications and subsystems"'
    # The released kind has no limits on these fields.
    spec.policies[].name: {inferred: false}
    spec.policies[].description: {inferred: false}
    spec.policies[].disabled: {inferred: false}
    spec.policies[].tags: {inferred: false}
    spec.policies[].tags[].name:
      inferred: false
      add: ['+kubebuilder:validation:Pattern=`^tags\..*`']
    spec.policies[].tags[].values:
      add: ['+kubebuilder:validation:MinItems=1', '+kubebuilder:validation:MaxItems=50']
    spec.policies[].applications.names:
      add: ['+kubebuilder:validation:MinItems=1', '+kubebuilder:validation:MaxItems=50']
    spec.policies[].subsystems.names:
      add: ['+kubebuilder:validation:MinItems=1', '+kubebuilder:validation:MaxItems=50']
    spec.policies[].services.names:
      add: ['+kubebuilder:validation:MinItems=1', '+kubebuilder:validation:MaxItems=50']
    spec.policies[].actions.names:
      add: ['+kubebuilder:validation:MinItems=1', '+kubebuilder:validation:MaxItems=50']
    spec.policies[].priorityOverride.quotaBased.usageTiers:
      inferred: false
      add: ['+kubebuilder:validation:MinItems=1']

api:
  # One PUT replaces every span policy of the team. Delete sends an empty list.
  overwrite:
    getQuery: {source_type: SOURCE_TYPE_SPANS}
  operations:
    create: PoliciesService_AtomicOverwriteSpanPolicies
    get: PoliciesService_GetCompanyPolicies
    update: PoliciesService_AtomicOverwriteSpanPolicies
    delete: PoliciesService_AtomicOverwriteSpanPolicies

# The released archiveRetention holds a backend reference, not the API object.
unwrap: [ArchiveRetention]

types:
  Policy:
    # A written policy holds these fields in "policy", next to its spanRules.
    requestWrapper: policy
    fields:
      # The released field is the request value: true disables the policy.
      enabled: {name: disabled, requestAs: disabled}
      description: {sendNullAsEmpty: true}
      priority: {required: true}
      # The released policy has no targets: the API reads one back for every span policy.
      targets: {skip: true}
      # The released services, actions, tags, and dpxlExpression are fields of the policy.
      spanRules: {inline: true}
      applicationRule: {name: applications}
      subsystemRule: {name: subsystems}
      archiveRetention:
        name: archiveRetention
        ref: {kind: ArchiveRetention, form: namedBackendOnly, type: ArchiveRetention, idField: Id, lookup: LookupArchiveRetentionName}
  SpanRules:
    fields:
      serviceRule: {name: services}
      actionRule: {name: actions}
      # The released tags are a list.
      tagRules: {name: tags, collection: list}
  TagRule:
    fields:
      tagName: {name: name}
      tagValue: {name: values, joinedBy: ","}
      ruleTypeId: {name: ruleType}
  quota.v1.Rule:
    fields:
      name: {name: names, joinedBy: ",", required: true}
      ruleTypeId: {name: ruleType, required: true}
  QuotaBased:
    fields:
      usageTiers: {required: true}
  UsageTier:
    fields:
      dailyQuotaPercentage: {required: true}
      priority: {required: true}

enums:
  quota.v1.Priority:
    zero: unspecified
    rejectZero: true
    values: [PRIORITY_TYPE_BLOCK, PRIORITY_TYPE_HIGH, PRIORITY_TYPE_MEDIUM, PRIORITY_TYPE_LOW]
    trimPrefix: PRIORITY_TYPE_
  RuleTypeId:
    zero: unspecified
    rejectZero: true
    values: [RULE_TYPE_ID_IS, RULE_TYPE_ID_IS_NOT, RULE_TYPE_ID_START_WITH, RULE_TYPE_ID_INCLUDES]
    names: {RULE_TYPE_ID_IS: is, RULE_TYPE_ID_IS_NOT: is_not, RULE_TYPE_ID_START_WITH: start_with, RULE_TYPE_ID_INCLUDES: includes}
