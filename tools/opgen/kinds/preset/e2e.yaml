serial: true
skipValues:
  AttachmentConfigPolicy:
    values: [AUTO, DISABLED]
    reason: TEMPORARY - the probe data for this value lands in part 8 of the same PR
  notification_center.ConnectorType:
    values: [SLACK, PAGERDUTY, EMAIL, PAGERDUTY_INCIDENTS, MICROSOFT_TEAMS, EVENTBRIDGE, INCIDENT_IO]
    reason: TEMPORARY - the probe data for this value lands in part 8 of the same PR
  notification_center.EntityType:
    values: [CASES]
    reason: TEMPORARY - the probe data for this value lands in part 8 of the same PR
skipChoices:
  notification_center.ConditionType:
    choices: [matchEntityType]
    reason: TEMPORARY - the probe data for this value lands in part 8 of the same PR
upgrade:
  from: '2.0'
  spec:
    name: '@{run}'
    description: Preset created before the operator upgrade
    connectorType: slack
    entityType: alerts
    parentId: preset_system_slack_alerts_basic
    configOverrides:
      - conditionType:
          matchEntityTypeAndSubType:
            entitySubType: logsImmediateTriggered
        messageConfig:
          fields:
            - fieldName: title
              template: Before upgrade
  field: description
  value: Preset updated after the operator upgrade
minimal:
  parentId: preset_system_generic_https_alerts_empty
  configOverrides:
    - conditionType:
        matchEntityTypeAndSubType:
          entitySubType: logsImmediateResolved
      messageConfig:
        fields:
          - fieldName: headers
            template: '{}'
          - fieldName: body
            template: '{ "groupingKey": "{{alert.groupingKey}}", "status": "{{alert.status}}", "groups": "{{alert.groups}}" }'
      payloadType: generic_https_default
values:
  connectorType: genericHttps
  entityType: alerts
  parentId: preset_system_generic_https_alerts_empty
  attachmentConfig: ENABLED
  configOverrides.conditionType:
    matchEntityTypeAndSubType:
      entitySubType: logsImmediateResolved
  configOverrides.payloadType: generic_https_default
  configOverrides.messageConfig.fields:
    - fieldName: headers
      template: '{}'
    - fieldName: body
      template: '{ "groupingKey": "{{alert.groupingKey}}", "status": "{{alert.status}}", "groups": "{{alert.groups}}" }'
