serial: true
upgrade:
  from: '2.0'
  spec:
    name: '@{run}'
    description: Preset created before the operator upgrade
    connectorType: slack
    entityType: alerts
    parentId: preset_system_slack_alerts_basic
    configOverrides:
      - conditionType:
          matchEntityTypeAndSubType:
            entitySubType: logsImmediateTriggered
        messageConfig:
          fields:
            - fieldName: title
              template: Before upgrade
  field: description
  value: Preset updated after the operator upgrade
minimal:
  parentId: preset_system_generic_https_alerts_empty
  configOverrides:
    - conditionType:
        matchEntityTypeAndSubType:
          entitySubType: logsImmediateResolved
      messageConfig:
        fields:
          - fieldName: headers
            template: '{}'
          - fieldName: body
            template: '{ "groupingKey": "{{alert.groupingKey}}", "status": "{{alert.status}}", "groups": "{{alert.groups}}" }'
      payloadType: generic_https_default
values:
  connectorType: genericHttps
  entityType: alerts
  parentId: preset_system_generic_https_alerts_empty
  attachmentConfig: ENABLED
  configOverrides.conditionType:
    matchEntityTypeAndSubType:
      entitySubType: logsImmediateResolved
  configOverrides.payloadType: generic_https_default
  configOverrides.messageConfig.fields:
    - fieldName: headers
      template: '{}'
    - fieldName: body
      template: '{ "groupingKey": "{{alert.groupingKey}}", "status": "{{alert.status}}", "groups": "{{alert.groups}}" }'
skipChoices:
  notification_center.ConditionType:
    choices: [matchEntityType]
    reason: Kubernetes 1.25, the oldest version in CI, rejects an empty-object oneOf arm in the CEL rule at admission
when:
  # Each entry is one valid pair of connector type and entity type, with the system parent preset
  # and a config that the preset type accepts. Probed on the live API: PAGERDUTY_INCIDENTS,
  # MICROSOFT_TEAMS, EVENTBRIDGE, and INCIDENT_IO are accepted for CASES only. Their ALERTS pairs
  # return 400, so they have no entry. The API refuses an override of the EventBridge field source.
  - match: {connectorType: slack, entityType: alerts}
    set:
      parentId: preset_system_slack_alerts_basic
      attachmentConfig: AUTO
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: logsImmediateTriggered}}
          payloadType: slack_structured
          messageConfig: {fields: [{fieldName: title, template: Coverage alert}]}
  - match: {connectorType: slack, entityType: cases}
    set:
      parentId: preset_system_slack_cases_basic
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: slack_raw
          messageConfig: {fields: [{fieldName: payload, template: '{ "text": "{{ case.title }}" }'}]}
  - match: {connectorType: genericHttps, entityType: alerts}
    set:
      parentId: preset_system_generic_https_alerts_empty
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: logsImmediateResolved}}
          payloadType: generic_https_default
          messageConfig:
            fields:
              - {fieldName: headers, template: '{}'}
              - {fieldName: body, template: '{ "groupingKey": "{{alert.groupingKey}}", "status": "{{alert.status}}", "groups": "{{alert.groups}}" }'}
  - match: {connectorType: genericHttps, entityType: cases}
    set:
      parentId: preset_system_generic_https_cases_empty
      attachmentConfig: DISABLED
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: generic_https_default
          messageConfig:
            fields:
              - {fieldName: headers, template: '{}'}
              - {fieldName: body, template: '{ "id": "{{ case.id }}" }'}
  - match: {connectorType: pagerDuty, entityType: alerts}
    set:
      parentId: preset_system_pagerduty_alerts_basic
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: metricThresholdMoreThanTriggered}}
          payloadType: pagerduty_triggered
          messageConfig: {fields: [{fieldName: summary, template: '{{ alertDef.name }}'}]}
  - match: {connectorType: pagerDuty, entityType: cases}
    set:
      parentId: preset_system_pagerduty_cases_basic
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: pagerduty_triggered
          messageConfig: {fields: [{fieldName: summary, template: '{{ case.title }}'}]}
  - match: {connectorType: pagerDutyIncidents, entityType: cases}
    set:
      parentId: preset_system_pagerduty_incidents_cases_basic
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: pagerduty_incidents_default
          messageConfig: {fields: [{fieldName: title, template: '{{ case.title }}'}]}
  - match: {connectorType: email, entityType: alerts}
    set:
      parentId: preset_system_email_alerts
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: logsImmediateTriggered}}
          payloadType: email_default
          messageConfig: {fields: [{fieldName: customSubject, template: '{{ alertDef.name }}'}]}
  - match: {connectorType: email, entityType: cases}
    set:
      parentId: preset_system_email_cases
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: email_default
          messageConfig: {fields: [{fieldName: customSubject, template: '{{ case.title }}'}]}
  - match: {connectorType: microsoftTeams, entityType: cases}
    set:
      parentId: preset_system_microsoft_teams_cases_basic
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: microsoft_teams_default
          messageConfig: {fields: [{fieldName: payload, template: '{ "text": "{{ case.title }}" }'}]}
  - match: {connectorType: eventBridge, entityType: cases}
    set:
      parentId: preset_system_eventbridge_cases_basic
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: eventbridge_default
          messageConfig:
            fields:
              - {fieldName: detailType, template: Coverage case}
              - {fieldName: detail, template: '{ "id": "{{ case.id }}" }'}
  - match: {connectorType: incidentIo, entityType: cases}
    set:
      parentId: preset_system_incident_io_cases_basic
      configOverrides:
        - conditionType: {matchEntityTypeAndSubType: {entitySubType: caseActivated}}
          payloadType: incident_io_default
          messageConfig: {fields: [{fieldName: title, template: '{{ case.title }}'}]}
