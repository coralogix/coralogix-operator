resource: Preset
mode: existing
validators:
  inferred: true
  fields:
    spec.configOverrides: {inferred: false}
    spec.configOverrides[].conditionType.matchEntityTypeAndSubType.entitySubType: {inferred: false}
    spec.configOverrides[].messageConfig.fields: {inferred: false}
    spec.configOverrides[].messageConfig.fields[].fieldName: {inferred: false}
    spec.configOverrides[].messageConfig.fields[].template: {inferred: false}
    spec.configOverrides[].payloadType: {inferred: false}
    spec.description: {inferred: false}
    spec.name: {inferred: false}
    spec.parentId: {inferred: false}
api:
  operations:
    create: PresetsService_CreateCustomPreset
    get: PresetsService_GetPreset
    update: PresetsService_ReplaceCustomPreset
    delete: PresetsService_DeleteCustomPreset
  customMethods: true
  requestWrapper: preset
  updateIDInBody: true
  serverSetID: true
unwrap: [AttachmentConfig]
types:
  Preset:
    fields:
      id: {readOnly: true}
      description: {required: true}
  ConfigOverrides:
    fields:
      conditionType: {required: true}
      messageConfig: {required: true}
  notification_center.ConditionType:
    fields:
      matchEntityType: {requireOne: true}
  MatchEntityTypeAndSubTypeCondition:
    fields:
      entitySubType: {required: true}
  MessageConfig:
    fields:
      fields: {required: true, collection: list, omitEmptyInRequest: true}
  notification_center.MessageConfigField:
    fields:
      fieldName: {required: true}
      template: {required: true}
enums:
  AttachmentConfigPolicy:
    verbatim: true
  notification_center.ConnectorType:
    zero: unspecified
    rejectZero: true
    rejected:
      - {value: IBM_EVENT_NOTIFICATIONS, reason: the released CRD never accepted this value}
      - {value: SERVICE_NOW, reason: the released CRD never accepted this value}
    names:
      GENERIC_HTTPS: genericHttps
      PAGERDUTY: pagerDuty
      PAGERDUTY_INCIDENTS: pagerDutyIncidents
      MICROSOFT_TEAMS: microsoftTeams
      EVENTBRIDGE: eventBridge
      INCIDENT_IO: incidentIo
  notification_center.EntityType:
    zero: unspecified
    rejectZero: true
    rejected:
      - {value: TEST_NOTIFICATIONS, reason: the released CRD never accepted this value}
      - {value: OLLY_SCHEDULED_TASKS, reason: the released CRD never accepted this value}
  PresetType:
    zero: unspecified
    rejectZero: true
