{{- if .Values.crds.create }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: slos.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: SLO
    listKind: SLOList
    plural: slos
    singular: slo
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SLO is the Schema for the slos API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SLOSpec defines the desired state of a SLO.
            properties:
              description:
                description: Human-readable description of the SLO.
                type: string
              labels:
                additionalProperties:
                  type: string
                description: List of labels.
                type: object
              name:
                description: Human-readable display name for the SLO. Required. A
                  missing or empty name is rejected.
                type: string
              ownershipTags:
                description: Service, environment, and team ownership configuration
                  for the SLO group and its permutations.
                properties:
                  environment:
                    description: Ownership for one dimension (service, environment,
                      or team). static_values are group-wide (broad) assignments.
                      label_keys are metric label names whose values are read per
                      permutation (label-driven). Both may be set; when both lists
                      are empty, that dimension is unset.
                    properties:
                      labelKeys:
                        description: Metric label names to use as sources (label-driven).
                          Actual values come from series at query time. Empty if not
                          using label-driven for this dimension.
                        items:
                          type: string
                        type: array
                      staticValues:
                        description: Group-wide static values (broad). Empty if not
                          using broad for this dimension.
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: Use either staticValues or labelKeys, not both
                      rule: '!(has(self.staticValues) && self.staticValues.size()
                        > 0 && has(self.labelKeys) && self.labelKeys.size() > 0)'
                  service:
                    description: Ownership for one dimension (service, environment,
                      or team). static_values are group-wide (broad) assignments.
                      label_keys are metric label names whose values are read per
                      permutation (label-driven). Both may be set; when both lists
                      are empty, that dimension is unset.
                    properties:
                      labelKeys:
                        description: Metric label names to use as sources (label-driven).
                          Actual values come from series at query time. Empty if not
                          using label-driven for this dimension.
                        items:
                          type: string
                        type: array
                      staticValues:
                        description: Group-wide static values (broad). Empty if not
                          using broad for this dimension.
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: Use either staticValues or labelKeys, not both
                      rule: '!(has(self.staticValues) && self.staticValues.size()
                        > 0 && has(self.labelKeys) && self.labelKeys.size() > 0)'
                  team:
                    description: Ownership for one dimension (service, environment,
                      or team). static_values are group-wide (broad) assignments.
                      label_keys are metric label names whose values are read per
                      permutation (label-driven). Both may be set; when both lists
                      are empty, that dimension is unset.
                    properties:
                      labelKeys:
                        description: Metric label names to use as sources (label-driven).
                          Actual values come from series at query time. Empty if not
                          using label-driven for this dimension.
                        items:
                          type: string
                        type: array
                      staticValues:
                        description: Group-wide static values (broad). Empty if not
                          using broad for this dimension.
                        items:
                          type: string
                        type: array
                    type: object
                    x-kubernetes-validations:
                    - message: Use either staticValues or labelKeys, not both
                      rule: '!(has(self.staticValues) && self.staticValues.size()
                        > 0 && has(self.labelKeys) && self.labelKeys.size() > 0)'
                type: object
              productType:
                description: 'Product type: APM for application performance monitoring
                  SLOs, UNSPECIFIED for manual/custom SLOs'
                enum:
                - unspecified
                - apm
                type: string
              sliType:
                description: SLOSpecSliType holds the sliType fields of the released
                  CR.
                properties:
                  apmSli:
                    description: Definition of an APM-based SLI with automatic query
                      generation
                    properties:
                      errorConfig:
                        description: Configuration for error-based APM SLI
                        type: object
                      filters:
                        description: Additional label-based filters to apply to the
                          metrics
                        items:
                          description: SLOApmFilter is the ApmFilter object of the
                            API.
                          properties:
                            key:
                              description: Label/tag name to filter on. Required.
                                A missing or empty key is rejected.
                              type: string
                            matchOperator:
                              description: 'How literals on `key` are compared. Every
                                item in `apmSli.filters` must use the same mode: all
                                implicit (legacy) or all explicit — mixing modes in
                                one list is rejected. Implicit: omitted or `APM_FILTER_MATCH_OPERATOR_UNSPECIFIED`
                                on every item — multiple items with the same `key`
                                OR-merge literals with exact (IS) comparison; sending
                                `UNSPECIFIED` is equivalent to omitting the field
                                (neither is stored as explicit `IS`). Explicit: `APM_FILTER_MATCH_OPERATOR_IS`,
                                `STARTS_WITH`, `ENDS_WITH`, or `INCLUDES` on every
                                item — each item is a separate AND criterion; OR applies
                                only among literals in that item (explicit `IS` differs
                                from implicit when several items share a `key`). Items
                                on different keys are AND-combined. Pattern operators
                                use literal substring matching (not caller-supplied
                                regex). Applies only when the item has at least one
                                literal: non-empty `values`, or deprecated `value`
                                when `values` is omitted or empty (non-empty `values`
                                takes precedence over `value`); otherwise rejected.'
                              enum:
                              - unspecified
                              - is
                              - startsWith
                              - endsWith
                              - includes
                              type: string
                            values:
                              description: 'Preferred: multiple values to match (OR
                                semantics, e.g. status IN [500, 503])'
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          type: object
                        type: array
                      groupingKeys:
                        description: Labels to group SLO results by
                        items:
                          type: string
                        type: array
                      latencyConfig:
                        description: Configuration for latency-based APM SLI
                        properties:
                          average:
                            description: Average/mean-based latency measurement
                            type: object
                          quantile:
                            description: Quantile/percentile-based latency measurement
                            properties:
                              percentile:
                                anyOf:
                                - type: integer
                                - type: string
                                description: Percentile for latency SLOs (0.95 = P95,
                                  0.99 = P99)
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                            type: object
                          threshold:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Threshold in milliseconds. Good when latency
                              <= threshold, bad when latency > threshold.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          timeWindow:
                            description: Time window for latency calculations. Required.
                              Omitting it is rejected.
                            enum:
                            - 1m
                            - 5m
                            type: string
                        required:
                        - timeWindow
                        type: object
                      services:
                        description: List of service names to monitor. Required. At
                          least one service; an empty list is rejected.
                        items:
                          type: string
                        minItems: 1
                        type: array
                    required:
                    - services
                    type: object
                  requestBasedMetric:
                    description: Definition of a request-based SLI based on metrics
                    properties:
                      goodEvents:
                        description: Definition of a metric used in SLOs
                        properties:
                          query:
                            description: Query string. Required. A missing or empty
                              query is rejected.
                            type: string
                        required:
                        - query
                        type: object
                      groupByLabels:
                        description: |-
                          GroupByLabels has no effect. The Coralogix API derives the SLO grouping itself and
                          the value is never sent. The field is kept because removing it would break existing
                          resources.
                          Deprecated: ignored by the operator and by the API.
                        items:
                          type: string
                        type: array
                      totalEvents:
                        description: Definition of a metric used in SLOs
                        properties:
                          query:
                            description: Query string. Required. A missing or empty
                              query is rejected.
                            type: string
                        required:
                        - query
                        type: object
                    required:
                    - goodEvents
                    - totalEvents
                    type: object
                  windowBasedMetric:
                    description: Definition of a window-based SLI based on metrics
                    properties:
                      comparisonOperator:
                        description: Comparison operator.
                        enum:
                        - greaterThan
                        - lessThan
                        - greaterThanOrEquals
                        - lessThanOrEquals
                        type: string
                      missingDataStrategy:
                        description: Missing data strategy.
                        enum:
                        - uncounted
                        - good
                        - bad
                        type: string
                      query:
                        description: Definition of a metric used in SLOs
                        properties:
                          query:
                            description: Query string. Required. A missing or empty
                              query is rejected.
                            type: string
                        required:
                        - query
                        type: object
                      threshold:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Threshold value.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      window:
                        description: Window slo window.
                        enum:
                        - 1m
                        - 5m
                        type: string
                    required:
                    - comparisonOperator
                    - query
                    - window
                    type: object
                type: object
                x-kubernetes-validations:
                - message: Exactly one of requestBasedMetric, windowBasedMetric, apmSli
                    must be set
                  rule: '(has(self.requestBasedMetric) ? 1 : 0) + (has(self.windowBasedMetric)
                    ? 1 : 0) + (has(self.apmSli) ? 1 : 0) == 1'
              targetThresholdPercentage:
                anyOf:
                - type: integer
                - type: string
                description: Target compliance percentage threshold for the SLO (e.g.,
                  99.9 for three nines).
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              window:
                description: SLOSpecWindow holds the window fields of the released
                  CR.
                properties:
                  timeFrame:
                    description: Rolling evaluation window (fixed-duration lookback).
                    enum:
                    - unspecified
                    - 7d
                    - 14d
                    - 21d
                    - 28d
                    - 90d
                    type: string
                type: object
            required:
            - name
            - sliType
            - targetThresholdPercentage
            - window
            type: object
            x-kubernetes-validations:
            - message: productType 'apm' requires sliType.apmSli
              rule: '!(has(self.productType) && self.productType == ''apm'') || has(self.sliType.apmSli)'
          status:
            description: SLOStatus defines the observed state of a SLO.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
              revision:
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
