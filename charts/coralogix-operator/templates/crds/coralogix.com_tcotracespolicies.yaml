                          maxItems: 50
                          minItems: 1
                          type: array
                        ruleType:
                          description: Rule type id.
                          enum:
                          - is
                          - is_not
                          - start_with
                          - includes
                          type: string
                      required:
                      - names
                      - ruleType
                      type: object
                    tags:
                      description: The tag rules. The service does not keep their
