                      type: string
                    priority:
                      description: TCO priority level assigned to a policy, controlling
                        how data is routed and archived.
                      enum:
                      - block
                      - high
                      - medium
                      - low
                      type: string
                    priorityOverride:
                      description: Priority override.
                      properties:
