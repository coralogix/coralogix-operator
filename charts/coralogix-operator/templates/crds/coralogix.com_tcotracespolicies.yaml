            properties:
              policies:
                description: List of policies.
                items:
                  description: TCOTracesPoliciesPolicy is the Policy object of the
                    API.
                  properties:
                    actions:
                      description: Rule.
                      properties:
                        names:
                          description: |-
                            The value(s) to match. For IS and IS_NOT rules, up to 50 comma-separated values. The service stores the values in lower case.
                            The API holds the values as one string, joined by ",".
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        ruleType:
                          description: Rule type id.
                          enum:
                          - is
                          - is_not
                          - start_with
                          - includes
