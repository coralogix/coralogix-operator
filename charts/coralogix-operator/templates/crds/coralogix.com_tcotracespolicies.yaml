                        properties:
                          name:
                            description: The tag name. Must start with "tags.".
                            pattern: ^tags\..*
                            type: string
                          ruleType:
                            enum:
                            - is
                            - is_not
                            - start_with
                            - includes
                            type: string
                          values:
                            description: |-
                              The tag value(s) to match. For IS and IS_NOT rules, up to 50 comma-separated values.
                              The API holds the values as one string, joined by ",".
                            items:
                              type: string
                            maxItems: 50
                            minItems: 1
                            type: array
                        required:
                        - name
                        - ruleType
                        - values
                        type: object
                      type: array
                  required:
                  - name
                  - priority
                  type: object
                  x-kubernetes-validations:
                  - message: dpxlExpression is mutually exclusive with services, actions,
                      tags, applications and subsystems
                    rule: '!(has(self.dpxlExpression) && (has(self.services) || has(self.actions)
                      || has(self.applications) || has(self.subsystems) || (has(self.tags)
