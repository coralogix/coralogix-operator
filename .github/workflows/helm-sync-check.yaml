name: helm-sync-check

on:
  pull_request:
    paths:
      - "charts/coralogix-operator/**"
      - "config/**"
      - "scripts/test-helm-image.sh"
      - ".github/workflows/helm-sync-check.yaml"
    branches:
      - main
      - release-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if Helm CRDs templates are updated
        run: |
          make helm-sync-check
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Check Helm image selection
        run: |
          helm lint charts/coralogix-operator --set secret.data.apiKey=test-key --set coralogixOperator.domain=gov.example.com
          bash scripts/test-helm-image.sh
