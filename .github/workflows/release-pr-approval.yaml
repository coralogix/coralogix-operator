name: Release PR Approval

# Approves and merges a release PR from `make bump` as github-actions[bot], so it needs no human
# review: it only re-publishes code already reviewed on main. Other PRs are left alone. Only a
# release PR from someone in .github/RELEASERS is approved (scripts/check-releaser.sh), and only
# once CI on its latest commit has passed (scripts/check-release-ci.sh). main requires no checks,
# so the PR has no auto-merge, which would merge on any approval while tests still run: this
# workflow merges it after checking CI once more, then starts Release, because a merge by
# GITHUB_TOKEN starts no push workflow. A run that finds the PR merged but never released starts
# Release itself; a Release run that was cancelled or failed stays stopped for a person to restart.
#
# It runs when the release PR changes, whenever a PR workflow finishes, and whenever a check from
# outside Actions finishes, so the approval follows the last check. A check that fails withdraws
# the approval until every check passes, and approvals of an older commit are dismissed.
#
# Both triggers run this file and the check scripts from main, never from the PR, so a PR cannot
# change what gets approved. Nothing from the PR is checked out or run; the diff is read through
# the API.
#
# The approval counts only while "Allow GitHub Actions to create and approve pull requests" is
# enabled for the repository.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  # Every workflow that a release PR starts; scripts/check-release-ci.sh lists the same ones.
  workflow_run:
    workflows:
      - Container
      - crd-validation
      - e2e-tests
      - helm-e2e-tests
      - helm-sync-check
      - integration-tests
      - sanity
      - unit-tests
      - upgrade-test
      - Version Bump
    # completed only: the job approves and merges in one go and withdraws the approval if the
    # merge fails, so no bot approval stays on an open PR for a starting run to withdraw. A run
    # that starts during the merge is caught by the CI check right before it.
    types: [completed]
    # Only runs on a release branch start this workflow. Without the filter, every run on every
    # branch starts one that the job's if: then skips. check_run has no branch filter.
    branches:
      - "prepare-v*"
  # Checks from outside Actions (CodeQL, GitGuardian) start no workflow_run, so one that finishes
  # last would leave the PR unapproved without this.
  check_run:
    types: [completed]

permissions: {}

jobs:
  approve:
    # Its own check run is named "Release PR: ...", which no check script waits for.
    name: "Release PR: approve"
    if: >-
      (github.event_name == 'pull_request_target' &&
       startsWith(github.head_ref, 'prepare-v') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'prepare-v') &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug != 'github-actions' &&
       startsWith(github.event.check_run.check_suite.head_branch, 'prepare-v'))
    runs-on: ubuntu-latest
    # Never cancel a running job: one cancelled between merging and starting Release would leave
    # the version merged but not released. A newer event replaces only a waiting run.
    concurrency:
      group: release-pr-approval-${{ github.head_ref || github.event.workflow_run.head_branch || github.event.check_run.check_suite.head_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_REF: ${{ github.head_ref || github.event.workflow_run.head_branch || github.event.check_run.check_suite.head_branch }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - id: pr
        name: Find the release PR
        run: |
          set -euo pipefail
          # Only a PR from this repository: a check_run event doesn't say where its branch lives.
          pr=$(gh pr list --head "$HEAD_REF" --base main --state open \
            --json number,headRefOid,isDraft,autoMergeRequest,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0] // empty')
          if [[ -z "$pr" ]]; then echo "::notice::No open PR from $HEAD_REF"; exit 0; fi
          jq -r '"number=\(.number)\nsha=\(.headRefOid)\ndraft=\(.isDraft)\nauto=\(.autoMergeRequest != null)"' <<< "$pr" >> "$GITHUB_OUTPUT"

      # Auto-merge would merge on any approval, also a teammate's while tests still run. Release
      # PRs opened before `make bump` stopped turning it on may still have it.
      - name: Turn off auto-merge
        if: ${{ steps.pr.outputs.auto == 'true' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR" --disable-auto

      - name: Start a release that a merge left behind
        # If a run merged the release PR and stopped before starting Release, the version has no
        # tag and no Release run since the merge. A merge by GITHUB_TOKEN starts no push workflow,
        # so nothing else would release it. A Release run since the merge, also a cancelled or
        # failed one, leaves the release to a person.
        if: ${{ steps.pr.outputs.number == '' }}
        run: |
          set -euo pipefail
          merged=$(gh pr list --head "$HEAD_REF" --base main --state merged \
            --json mergeCommit,mergedAt,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0] // empty | "\(.mergeCommit.oid) \(.mergedAt)"')
          if [[ -z "$merged" ]]; then exit 0; fi
          read -r sha merged_at <<< "$merged"
          version=$(gh api "repos/$GH_REPO/contents/charts/coralogix-operator/Chart.yaml?ref=$sha" \
            -H "Accept: application/vnd.github.raw" | yq eval '.version' -)
          if gh api "repos/$GH_REPO/git/ref/tags/v$version" --silent 2> /dev/null; then exit 0; fi
          runs=$(gh run list --workflow release.yaml --limit 100 --json createdAt \
            --jq "[.[] | select(.createdAt >= \"$merged_at\")] | length")
          if [[ "$runs" != "0" ]]; then
            echo "::notice::v$version is not released, but Release already ran after the merge. Re-run or start it from the Actions tab to release it."
            exit 0
          fi
          gh workflow run release.yaml --ref main
          echo "Started Release for v$version, which the merge of $sha left without a release" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dismiss approvals of older commits
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/pulls/$PR/reviews" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id != \"$HEAD_SHA\") | .id" |
            while read -r id; do
              gh api -X PUT "repos/$GH_REPO/pulls/$PR/reviews/$id/dismissals" \
                -f message="Superseded by a new push; re-checking the release PR." -f event=DISMISS > /dev/null
            done

      # Only the people in .github/RELEASERS release: the author and every commit's signer.
      - name: Check who opened the release PR
        if: ${{ steps.pr.outputs.number != '' && steps.pr.outputs.draft == 'false' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: scripts/check-releaser.sh "$PR"

      - name: Check the diff
        if: ${{ steps.pr.outputs.number != '' && steps.pr.outputs.draft == 'false' }}
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          base_version=$(yq eval '.version' charts/coralogix-operator/Chart.yaml)
          gh api "repos/$GH_REPO/compare/main...$HEAD_SHA" -H "Accept: application/vnd.github.diff" |
            scripts/check-release-pr.sh "$base_version"

      - id: ci
        name: Wait for green CI
        if: ${{ steps.pr.outputs.number != '' && steps.pr.outputs.draft == 'false' }}
        env:
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          if scripts/check-release-ci.sh "$HEAD_SHA"; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to the checked commit: a later push needs its own approval.
      - name: Approve
        if: ${{ steps.ci.outputs.green == 'true' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          approved=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/reviews" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .state == \"APPROVED\" and .commit_id == \"$HEAD_SHA\")] | length")
          if [[ "$approved" != "0" ]]; then echo "Already approved $HEAD_SHA"; exit 0; fi
          gh api -X POST "repos/$GH_REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA" \
            -f body="Release PR: only the version changes, and CI has passed. Approved and merged by the Release PR Approval workflow." \
            --silent

      - name: Merge and release
        if: ${{ steps.ci.outputs.green == 'true' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          # A check re-run since the CI step above holds the merge, and the approval is withdrawn
          # below: main requires no checks, so GitHub wouldn't wait for it.
          if ! scripts/check-release-ci.sh "$HEAD_SHA"; then
            echo "::error::A check on #$PR changed after the approval; the approval is withdrawn until every check passes again."
            exit 1
          fi
          # --match-head-commit refuses to merge if the branch moved after the checks above.
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
          if ! gh workflow run release.yaml --ref main; then
            echo "::error::Merged #$PR but could not start Release. Run it from the Actions tab on main."
            exit 1
          fi
          echo "Merged #$PR and started Release" | tee -a "$GITHUB_STEP_SUMMARY"

      # A failed step, or CI that is not green (a check failed or runs again), withdraws the
      # approval of a PR that is still open: one this run gave before the merge failed, or one an
      # earlier run gave the same commit.
      - name: Dismiss the approval
        if: >-
          ${{ steps.pr.outputs.number != '' &&
          (failure() || cancelled() || steps.ci.outputs.green == 'false') }}
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --json state --jq .state)
          if [[ "$state" != OPEN ]]; then echo "PR #$PR is $state; nothing to withdraw"; exit 0; fi
          gh api --paginate "repos/$GH_REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id' |
            while read -r id; do
              gh api -X PUT "repos/$GH_REPO/pulls/$PR/reviews/$id/dismissals" \
                -f message="The release PR no longer passes its checks; approval follows when they pass again." -f event=DISMISS > /dev/null
            done
