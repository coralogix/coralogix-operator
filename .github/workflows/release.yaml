name: Release

# Releases every merge to main whose version is not released yet: the version in
# charts/coralogix-operator/Chart.yaml, which PRs raise with `make bump` (checked by Version
# Bump). Publishes the image (also as latest), the chart to JFrog, and a GitHub release that
# creates the vX.Y.Z tag.
#
# The tag is created with GITHUB_TOKEN, which does not start other workflows, so the image and
# chart workflows are called here instead of being triggered by it. A merge whose version is
# already tagged (a docs-only PR, or a run of an older commit) publishes nothing.
on:
  push:
    branches:
      - main
  # Retries a release from main after a failed run.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One release at a time. A newer merge waiting here replaces an older waiting one, which is
# fine: the newer commit carries the older one's changes and a higher version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(yq eval '.version' charts/coralogix-operator/Chart.yaml)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            released=true
            echo "$tag is already released; nothing to publish."
          else
            released=false
            echo "Releasing $tag"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Push image
    needs: version
    if: ${{ needs.version.outputs.released == 'false' }}
    uses: ./.github/workflows/container.yaml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  chart:
    name: Publish chart
    needs: [version, image]
    uses: ./.github/workflows/helm-chart-deploy.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write

  github-release:
    name: Create GitHub release
    needs: [version, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Create release
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
