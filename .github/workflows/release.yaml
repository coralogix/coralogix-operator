name: Release

# Releases every merge to main whose version is not released yet: the version in
# charts/coralogix-operator/Chart.yaml, which PRs raise with `make bump` (checked by Version
# Bump). Publishes the image (also as latest), the chart to JFrog, and a GitHub release that
# creates the vX.Y.Z tag.
#
# The tag is created with GITHUB_TOKEN, which does not start other workflows, so the image and
# chart workflows are called here instead of being triggered by it. A merge whose version is
# already tagged publishes nothing if it only changes docs, tests or CI, and fails otherwise:
# that PR reused a released version and needs a new bump.
on:
  push:
    branches:
      - main
  # Retries a release from main after a failed run.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# One release at a time. A newer merge waiting here replaces an older waiting one, which is
# fine: the newer commit carries the older one's changes and a higher version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.version.outputs.released }}
    steps:
      # Full history and tags, so the tag lookup below is local and cannot fail on the network.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(yq eval '.version' charts/coralogix-operator/Chart.yaml)
          tag="v$version"
          if tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            # The tag can point at an earlier merge: a docs-only PR (no bump needed), or a PR
            # that bumped to the same version as one merged before it. Only the first is fine.
            # Same paths as the Version Bump check ignores.
            if ! git diff --quiet "$tagged" HEAD -- . ':(exclude)docs' ':(exclude)tests' \
              ':(exclude).github' ':(glob,exclude)**/*.md'; then
              echo "::error::$tag is already released from $tagged, and this merge changes what ships. Bump the version in a new PR with 'make bump'."
              exit 1
            fi
            released=true
            echo "$tag is already released; nothing to publish."
          else
            released=false
            echo "Releasing $tag"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "released=$released"
          } >> "$GITHUB_OUTPUT"

  image:
    name: Push image
    needs: version
    if: ${{ needs.version.outputs.released == 'false' }}
    uses: ./.github/workflows/container.yaml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  chart:
    name: Publish chart
    needs: [version, image]
    uses: ./.github/workflows/helm-chart-deploy.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: read
      id-token: write

  github-release:
    name: Create GitHub release
    needs: [version, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Create release
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
