name: "[Docs] Event for Sync"

permissions:
  contents: read

on:
  workflow_dispatch:
  # Called by the Release workflow, which creates the release tag with GITHUB_TOKEN. Tags made
  # with GITHUB_TOKEN do not start workflows, so the push below never sees a release tag.
  workflow_call:
  push:
    tags:
      - "v*"
    paths:
      - '/README.md'
      - '/docs/metrics.md'
      - '/charts/coralogix-operator/README.md'
      - '/docs/prometheus-integration.md'
      - '/docs/api.md'
      - '/tools/cxo-observer/README.md'
jobs:
  trigger_action:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: coralogix/documentation
          event-type: trigger-deploy
