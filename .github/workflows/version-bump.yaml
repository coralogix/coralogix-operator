name: Version Bump

# A merge to main that raises the version in Chart.yaml releases it (see release.yaml). Checks
# that cmd/main.go and the chart agree on the version, and that a changed version is above main.
on:
  pull_request:
    branches:
      - main
    paths:
      - "cmd/main.go"
      - "charts/coralogix-operator/Chart.yaml"
      - "scripts/check-version-bump.sh"
      - ".github/workflows/version-bump.yaml"

permissions:
  contents: read

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "$BASE_REF"

      - name: Check version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version-bump.sh "origin/$BASE_REF"
