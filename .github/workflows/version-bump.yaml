name: Version Bump

# Every merge to main is released from the version in Chart.yaml (see release.yaml), so a PR
# that changes what ships must raise it with `make bump`. Docs, tests and CI changes do not.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - ".github/**"
      - "**.md"

permissions:
  contents: read

jobs:
  check:
    name: Check version bump
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "$BASE_REF"

      - name: Check version bump
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version-bump.sh "origin/$BASE_REF"
