name: coverage-tests

# Runs the generated coverage specs of tests/e2e against Kind clusters. A coverage spec sends
# an enum value or a oneOf arm that the generated e2e spec does not. The specs run in parallel
# shards. tools/opgen writes the shard list to tests/e2e/coverage-shards.yaml, so a new step
# needs no edit here. The image is built once and loaded into each Kind cluster.
# Called by live-tests.yaml, which owns the triggers, the shared Coralogix concurrency group,
# and the result job that branch protection requires.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  shards:
    name: Read the shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read the shard file
        id: read
        run: |
          set -euo pipefail
          # The shard file has a generator header of comment lines, then JSON.
          matrix=$(grep -v '^#' tests/e2e/coverage-shards.yaml | jq -c '{include: [.shards[] | {name, filter}]}')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build the image
    runs-on: ubuntu-latest
    env:
      IMG: coralogix-operator-image:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the controller-manager image
        uses: ./.github/actions/build-operator-image
        with:
          image: ${{ env.IMG }}
      - name: Save the image
        run: docker save "${IMG}" | gzip > operator-image.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: operator-image
          path: operator-image.tar.gz
          retention-days: 1

  tests:
    name: Coverage ${{ matrix.name }}
    needs: [shards, build-image]
    runs-on: ubuntu-latest
    strategy:
      # One shard that fails must not hide the failures of the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    env:
      IMG: coralogix-operator-image:latest
      CORALOGIX_REGION: ${{ secrets.CORALOGIX_REGION }}
      CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
      TEST_TEAM_ID: ${{ secrets.TEST_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.4.0
      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: operator-image
      - name: Load the controller-manager image into Kind
        run: |
          gunzip -c operator-image.tar.gz | docker load
          kind load docker-image "${IMG}" --name chart-testing
      - name: Deploy the controller-manager
        run: make deploy
      - name: Run the coverage specs of the shard
        env:
          SHARD_FILTER: ${{ matrix.filter }}
        run: make e2e-tests E2E_GINKGO_LABEL_FILTER="${SHARD_FILTER}"
      - name: Collect Operator Logs
        if: always()
        run: |
          scripts/collect-logs.sh
