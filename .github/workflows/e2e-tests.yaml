name: e2e-tests
on:
  schedule:
    - cron: 0 0 * * *
  push:
    branches:
      - main
      - release-*
    paths-ignore:
      - "charts/**"
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - "charts/**"
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  # Shared across e2e, helm-e2e, upgrade-test, and integration-tests so those
  # live suites cannot overlap on the same Coralogix team (archive metrics,
  # TCO, quota, IP access).
  group: coralogix-operator-live-cx
  # Not cancel-in-progress: these specs create real Coralogix resources, and cleanup happens in
  # the suite's own teardown. Cancelling kills the Kind cluster before finalizers run, so the
  # remote resources leak and pollute the shared team. Let the old run finish and queue behind
  # it instead.
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      IMG: coralogix-operator-image:latest
      CORALOGIX_REGION: ${{ secrets.CORALOGIX_REGION }}
      CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
      SCOPE_RECONCILE_INTERVAL_SECONDS: 30
      CONNECTOR_RECONCILE_INTERVAL_SECONDS: 30
      # IPAccess is a company-wide singleton, so a concurrently running e2e job can wipe the
      # settings this job's specs are asserting on. A periodic reconcile lets the operator push
      # its desired state back, the same self-healing the Scope specs rely on.
      IPACCESS_RECONCILE_INTERVAL_SECONDS: 30
      ARCHIVELOGSTARGET_RECONCILE_INTERVAL_SECONDS: 30
      ARCHIVEMETRICSTARGET_RECONCILE_INTERVAL_SECONDS: 30
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LOGS_BUCKET: ${{ secrets.LOGS_BUCKET }}
      METRICS_BUCKET: ${{ secrets.METRICS_BUCKET }}
      SLACK_INTEGRATION_ID: ${{ secrets.SLACK_INTEGRATION_ID }}
      SLACK_INTEGRATION_CHANNEL: ${{ secrets.SLACK_INTEGRATION_CHANNEL }}
      PD_INTEGRATION_ID: ${{ secrets.PD_INTEGRATION_ID }}
      TEST_TEAM_ID: ${{ secrets.TEST_TEAM_ID }}
      # Org-scoped key that may create/delete teams. When set, the job provisions a disposable
      # team and runs fully inside it (see the "Provision an ephemeral Coralogix team" step).
      # When unset, the job keeps using the shared team from CORALOGIX_API_KEY as before.
      CORALOGIX_ORG_API_KEY: ${{ secrets.CORALOGIX_ORG_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Build the controller-manager image
        uses: ./.github/actions/build-operator-image
        with:
          image: ${{ env.IMG }}
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.4.0
      - name: Load the controller-manager image into Kind
        run: |
          kind load docker-image ${{ env.IMG }} --name chart-testing
      # Ephemeral-team isolation (opt-in): the live e2e suites all target one shared Coralogix
      # team, whose team-wide singleton state (TCO policies, archive targets, IP access, quota
      # allocation rules, global router) is currently protected only by serializing every run
      # through the coralogix-operator-live-cx concurrency group. When the
      # CORALOGIX_ORG_API_KEY secret is configured, provision a disposable team plus a
      # team-scoped API key and run this whole job against it, so overlapping runs are truly
      # isolated and the serialization queue can eventually be dropped. Without the secret this
      # step is skipped and the job keeps using the shared CORALOGIX_API_KEY secret as before.
      - name: Provision an ephemeral Coralogix team
        if: env.CORALOGIX_ORG_API_KEY != ''
        run: |
          go run ./tests/ephemeralteam create > ephemeral-team.env
          # Mask the minted key BEFORE it is written to $GITHUB_ENV or any log.
          key="$(sed -n 's/^CORALOGIX_API_KEY=//p' ephemeral-team.env)"
          echo "::add-mask::$key"
          # Workflow-file env would shadow a GITHUB_ENV variable of the same name, so expose
          # the key under a distinct name; the steps that need it override CORALOGIX_API_KEY
          # at step level.
          echo "EPHEMERAL_CORALOGIX_API_KEY=$key" >> "$GITHUB_ENV"
          grep '^EPHEMERAL_TEAM_' ephemeral-team.env >> "$GITHUB_ENV"
          rm ephemeral-team.env
      - name: Deploy the controller-manager
        env:
          # Prefer the ephemeral team's key; fall back to the shared team's secret.
          CORALOGIX_API_KEY: ${{ env.EPHEMERAL_CORALOGIX_API_KEY || secrets.CORALOGIX_API_KEY }}
        run: |
          make deploy
      - name: Run e2e Tests
        env:
          # Prefer the ephemeral team's key; fall back to the shared team's secret.
          CORALOGIX_API_KEY: ${{ env.EPHEMERAL_CORALOGIX_API_KEY || secrets.CORALOGIX_API_KEY }}
        run: |
          make e2e-tests
      # Delete the ephemeral team only when everything passed. A failed run keeps the team so
      # its state can be inspected; leaked teams carry the cx-operator-e2e-ephemeral- name
      # prefix and can be swept by a scheduled cleanup.
      - name: Delete the ephemeral Coralogix team
        if: success() && env.EPHEMERAL_TEAM_ID != ''
        run: |
          go run ./tests/ephemeralteam delete "$EPHEMERAL_TEAM_ID"
      - name: Collect Operator Logs
        if: always()
        run: |
          scripts/collect-logs.sh

  notify-failure:
    name: Notify Slack on failure
    # Scheduled (nightly) runs alert. Pull request and push runs stay quiet.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs:
      - tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          # Slack incoming webhook URL, from the SLACK_CI_WEBHOOK_URL repository secret.
          # Keep the URL out of both the logs and the process list.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_CI_WEBHOOK_URL is not set; skipping the Slack notification."
            exit 0
          fi
          umask 077
          curl_config="$(mktemp)"
          trap 'rm -f "$curl_config"' EXIT
          printf 'url = "%s"\n' "$SLACK_WEBHOOK_URL" > "$curl_config"
          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | map("• \(.key): \(.value.result)")
            | join("\n")
          ')
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg ref "$REF_NAME" \
            --arg event "$EVENT_NAME" \
            --arg url "$RUN_URL" \
            --arg jobs "$failed_jobs" \
            '{
              text: ":rotating_light: Acceptance tests failed",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ":rotating_light: *Acceptance tests failed*\n*Repository:* \($repo)\n*Ref:* \($ref)\n*Trigger:* \($event)\n*Failed jobs:*\n\($jobs)\n<\($url)|View the workflow run>"
                  }
                }
              ]
            }' \
            | curl --config "$curl_config" \
                --fail --silent --show-error \
                --max-time 30 --retry 3 --retry-connrefused \
                --header 'Content-Type: application/json' \
                --data @- \
                --output /dev/null \
                --write-out 'Slack responded with HTTP %{http_code}\n'
