name: e2e-tests

# Runs the e2e specs against a Kind cluster with the operator deployed by `make deploy`.
# Called by live-tests.yaml, which owns the triggers, the shared Coralogix concurrency group,
# the code-change filter, and the result job that branch protection requires.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: E2E tests
    runs-on: ubuntu-latest
    env:
      IMG: coralogix-operator-image:latest
      CORALOGIX_REGION: ${{ secrets.CORALOGIX_REGION }}
      CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
      SCOPE_RECONCILE_INTERVAL_SECONDS: 30
      CONNECTOR_RECONCILE_INTERVAL_SECONDS: 30
      # IPAccess is a company-wide singleton, so a concurrently running e2e job can wipe the
      # settings this job's specs are asserting on. A periodic reconcile lets the operator push
      # its desired state back, the same self-healing the Scope specs rely on.
      IPACCESS_RECONCILE_INTERVAL_SECONDS: 30
      ARCHIVELOGSTARGET_RECONCILE_INTERVAL_SECONDS: 30
      ARCHIVEMETRICSTARGET_RECONCILE_INTERVAL_SECONDS: 30
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LOGS_BUCKET: ${{ secrets.LOGS_BUCKET }}
      METRICS_BUCKET: ${{ secrets.METRICS_BUCKET }}
      SLACK_INTEGRATION_ID: ${{ secrets.SLACK_INTEGRATION_ID }}
      # A service name from the tenant's APM Service Catalog. The APM SLO specs fail
      # loudly in CI without it, instead of skipping silently.
      CORALOGIX_SLO_APM_SERVICE: ${{ secrets.CORALOGIX_SLO_APM_SERVICE }}
      SLACK_INTEGRATION_CHANNEL: ${{ secrets.SLACK_INTEGRATION_CHANNEL }}
      PD_INTEGRATION_ID: ${{ secrets.PD_INTEGRATION_ID }}
      TEST_TEAM_ID: ${{ secrets.TEST_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Build the controller-manager image
        uses: ./.github/actions/build-operator-image
        with:
          image: ${{ env.IMG }}
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.4.0
      - name: Load the controller-manager image into Kind
        run: |
          kind load docker-image ${{ env.IMG }} --name chart-testing
      - name: Deploy the controller-manager
        run: |
          make deploy
      - name: Run e2e Tests
        run: |
          make e2e-tests
      - name: Collect Operator Logs
        if: always()
        run: |
          scripts/collect-logs.sh
