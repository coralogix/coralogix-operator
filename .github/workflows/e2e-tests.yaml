name: e2e-tests

# Runs the e2e specs against Kind clusters with the operator deployed by `make deploy`.
# The image and the test binary are built once. Two shards then each create a Kind cluster.
# Both shards use this suite's Coralogix account. tests/e2e/live-shards.yaml names the
# specs that stay in the shared shard. The rest shard is the catch-all.
# Called by live-tests.yaml, which owns the triggers, the shared Coralogix concurrency group,
# the code-change filter, and the result job that branch protection requires.
on:
  workflow_call:
    secrets:
      api_key:
        required: true
      logs_bucket:
        required: true
      metrics_bucket:
        required: true
      aws_region:
        required: true
      slack_channel:
        required: true

permissions:
  contents: read
  actions: write

jobs:
  shards:
    name: Read the shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read the shard file
        id: read
        run: |
          set -euo pipefail
          {
            echo "matrix<<EOF"
            scripts/e2e-shards.sh matrix
            echo EOF
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build the image
    runs-on: ubuntu-latest
    env:
      IMG: coralogix-operator-image:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Build the controller-manager image
        uses: ./.github/actions/build-operator-image
        with:
          image: ${{ env.IMG }}
      - name: Compile the e2e test binary
        run: make e2e-test-binary
      - name: Save the image
        run: docker save "${IMG}" | gzip > operator-image.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: operator-image-e2e
          path: operator-image.tar.gz
          retention-days: 1
      - name: Upload the e2e test binary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binary-e2e
          path: tests/e2e/e2e.test
          retention-days: 1

  tests:
    name: E2E tests (${{ matrix.name }})
    needs: [shards, build]
    runs-on: ubuntu-latest
    strategy:
      # One shard that fails must not hide the failures of the other.
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    env:
      IMG: coralogix-operator-image:latest
      CORALOGIX_REGION: EU2
      CORALOGIX_API_KEY: ${{ secrets.api_key }}
      SCOPE_RECONCILE_INTERVAL_SECONDS: 30
      CONNECTOR_RECONCILE_INTERVAL_SECONDS: 30
      # IPAccess is a company-wide singleton. It runs in the shared shard only.
      # A periodic reconcile lets the operator push its desired state back.
      IPACCESS_RECONCILE_INTERVAL_SECONDS: 30
      ARCHIVELOGSTARGET_RECONCILE_INTERVAL_SECONDS: 30
      ARCHIVEMETRICSTARGET_RECONCILE_INTERVAL_SECONDS: 30
      AWS_REGION: ${{ secrets.aws_region }}
      LOGS_BUCKET: ${{ secrets.logs_bucket }}
      METRICS_BUCKET: ${{ secrets.metrics_bucket }}
      SLACK_INTEGRATION_CHANNEL: ${{ secrets.slack_channel }}
      # The service prepare-ci-team creates. The APM SLO specs fail in CI without it.
      CORALOGIX_SLO_APM_SERVICE: ci-acceptance-apm
      E2E_FOCUS: ${{ matrix.focus }}
      E2E_SKIP: ${{ matrix.skip }}
      E2E_SUITE: e2e.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.4.0
      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: operator-image-e2e
          path: image
      - name: Load the controller-manager image into Kind
        run: |
          gunzip -c image/operator-image.tar.gz | docker load
          kind load docker-image "${IMG}" --name chart-testing
      - name: Deploy the controller-manager
        run: make deploy
      - name: Download the e2e test binary
        uses: actions/download-artifact@v4
        with:
          name: e2e-binary-e2e
      - name: Run e2e Tests
        run: |
          chmod +x e2e.test
          bash .github/scripts/ci-account.sh lookup make e2e-tests
      - name: Collect Operator Logs
        if: always()
        run: scripts/collect-logs.sh
