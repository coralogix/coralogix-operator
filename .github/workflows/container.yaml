name: Container
on:
  pull_request:
    paths-ignore:
      - "charts/**"
      - "docs/**"
      - "**.md"
  push:
    branches:
      - "main"
      - "release-*"
    tags:
      - "v*"
    paths-ignore:
      - "charts/**"
  # Called by the Release workflow, which creates the tag with GITHUB_TOKEN. Tag pushes made
  # with GITHUB_TOKEN do not start workflows, so the release calls this one directly.
  workflow_call:
    inputs:
      tag:
        description: Release tag to check out, build and push, for example v2.16.0.
        required: true
        type: string
      latest:
        description: Also push the latest tag. False for patches on older release lines.
        required: true
        type: boolean

# The image is pushed to DockerHub with credentials from secrets.*, never to GHCR, so the
# workflow token only ever needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REGISTRY: coralogixrepo/coralogix-operator

jobs:
  build:
    name: Build Container (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: standard
            suffix: ""
            gofips140: "off"
            godebug: ""
          - variant: fips
            suffix: "-fips"
            gofips140: "v1.0.0"
            godebug: "fips140=on"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ github.repository == 'coralogix/coralogix-operator' && github.event_name != 'pull_request' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: ${{ !inputs.tag }}
        uses: docker/metadata-action@c4ee3adeed93b1fa6a762f209fb01608c1a22f1e
        with:
          images: ${{ env.DOCKERHUB_REGISTRY }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true

      # A release call names its tags itself: metadata-action would derive them from the caller's
      # ref (the branch the Release workflow was dispatched from), not from the release tag.
      - name: Resolve image tags
        id: tags
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
          REF_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          {
            echo "tags<<EOF"
            if [ -n "$RELEASE_TAG" ]; then
              echo "$DOCKERHUB_REGISTRY:$RELEASE_TAG$SUFFIX"
              if [ "$LATEST" = "true" ]; then
                echo "$DOCKERHUB_REGISTRY:latest$SUFFIX"
              fi
            else
              echo "$META_TAGS"
              echo "$DOCKERHUB_REGISTRY:$REF_TAG$SUFFIX"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # No QEMU: the builder stage is pinned to the build platform and cross-compiles with
      # GOARCH, and the runtime stage only copies the binary in, so nothing needs emulating.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build And Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            GOFIPS140=${{ matrix.gofips140 }}
            GODEBUG=${{ matrix.godebug }}
          push: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
          # Keep the published manifest shape as it was before the action was upgraded;
          # build-push-action v6 would otherwise attach provenance attestations.
          provenance: false
          # No gha layer cache here on purpose: measured at 4.5 minutes of cache export per
          # run (mode=max has to push the whole multi-GB builder stage), while the only layer
          # it could ever restore is `go mod download` - the build layer is invalidated by any
          # source change. Cross-compiling instead of emulating is where the win actually is.
          tags: ${{ steps.tags.outputs.tags }}
