name: helm-release

on:
  workflow_dispatch:
  push:
    branches:
      - release-*
    paths:
      - charts/coralogix-operator/Chart.yaml
  # Called by the Release workflow after the image is pushed. Its commits are made with
  # GITHUB_TOKEN and do not trigger the push event above.
  workflow_call:
    inputs:
      ref:
        description: Commit to package the chart from.
        required: true
        type: string
      version:
        description: Chart version the release expects, for example 2.16.0.
        required: true
        type: string
      upload:
        description: Upload the chart. False packages it and signs in to JFrog only, for a release dry run.
        required: true
        type: boolean

# The chart is uploaded to Artifactory using a short-lived token obtained via GitHub OIDC
# (id-token: write). contents: read is all the workflow token itself needs.
permissions:
  contents: read
  id-token: write # OIDC token for the JFrog exchange

env:
  CHART_VERSION: $(yq eval '.version' charts/coralogix-operator/Chart.yaml)
  CHART_NAME: coralogix-operator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.4.0
        with:
          ref: ${{ inputs.ref }}
      # A dry run packages the unbumped chart, so there is no version to match.
      - name: Check chart version matches the release
        if: ${{ inputs.version && inputs.upload }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          chart_version=$(yq eval '.version' charts/coralogix-operator/Chart.yaml)
          if [ "$chart_version" != "$RELEASE_VERSION" ]; then
            echo "::error::Chart.yaml version $chart_version does not match release version $RELEASE_VERSION"
            exit 1
          fi
      - name: Set up JFrog CLI
        # Exchanges this job's GitHub OIDC JWT for a short-lived Artifactory token,
        # replacing the rotated JFROG_USER / JFROG_PASSWORD secret pair. The action
        # calls core.setSecret() on its outputs, so the token stays masked in the log.
        id: jfrog
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://cgx.jfrog.io
        with:
          oidc-provider-name: github
          oidc-audience: jfrog-github
      - name: Setup Helm Repo
        run: |
          cd charts/coralogix-operator
          helm package .
      # Proves the OIDC token exchange gave a working Artifactory token, also on a dry run.
      - name: Check Artifactory access
        run: jf rt ping
      - name: use-jfrog-cli
        if: ${{ !inputs.version || inputs.upload }}
        run: |
          cd charts/coralogix-operator
          jf rt upload "${{ env.CHART_NAME }}-*.tgz" coralogix-charts
