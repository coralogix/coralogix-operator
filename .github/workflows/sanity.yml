name: sanity

on:
  push:
    branches:
      - main
      - release-*
    paths-ignore:
      - "charts/**"
  pull_request:
    branches:
      - main
      - release-*
    paths-ignore:
      - "charts/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-docs:
    name: Check generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      - name: Generate docs and manifests
        run: |
          go mod tidy
          make codegen
          make helm-sync-docs
      - name: Check for changes
        run: |
          if ! git diff --exit-code || [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            echo "Some files are out of date. Please run the following commands and commit the changes:"
            echo "    go mod tidy"
            echo "    make codegen"
            echo "    make helm-sync-docs"
            exit 1
          fi
      - name: Check CRD sizes
        run: make crd-size-check

  opgen:
    name: Operator generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version check builds the generator at the base commit
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/opgen/go.sum
      - name: Download the operator modules
        run: go mod download
      - name: Build and test the generator
        run: make opgen-test
      - name: Test the generator version check
        run: bash tools/opgen/scripts/check-version-change_test.sh
      - name: Require a new generator version when its output changes
        if: github.event_name == 'pull_request'
        run: tools/opgen/scripts/check-version-change.sh '${{ github.event.pull_request.base.sha }}'

  linters:
    name: Linter Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run golangci-lint on the operator generator
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: tools/opgen
          args: --timeout=5m --config=../../.golangci.yaml
