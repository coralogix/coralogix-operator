name: upgrade-test

# Upgrades the operator from released chart versions to the chart in this checkout, and checks the Group SCIM migration.
# Called by live-tests.yaml, which owns the triggers, the shared Coralogix concurrency group,
# the code-change filter, and the result job that branch protection requires.
on:
  workflow_call:
    inputs:
      suite:
        description: upgrade or group-scim
        required: true
        type: string
      operator_version:
        description: Released chart line for an upgrade run
        required: false
        type: string
        default: ""
    secrets:
      api_key:
        required: true
      ai_prefix:
        required: false
      logs_bucket:
        required: false
      metrics_bucket:
        required: false
      aws_region:
        required: false
      slack_channel:
        required: false

permissions:
  contents: read
  actions: write

jobs:
  check-suite:
    name: Check suite input
    runs-on: ubuntu-latest
    steps:
      - name: Require a known suite
        env:
          SUITE: ${{ inputs.suite }}
          VERSION: ${{ inputs.operator_version }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            upgrade)
              case "$VERSION" in
                0.5|1.0|2.0) ;;
                *) echo 'Upgrade version must be 0.5, 1.0, or 2.0' >&2; exit 1 ;;
              esac
              ;;
            group-scim) ;;
            *) echo 'Suite must be upgrade or group-scim' >&2; exit 1 ;;
          esac

  upgrade-test:
    name: Upgrade Test
    needs: check-suite
    if: ${{ inputs.suite == 'upgrade' && needs.check-suite.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      IMG_REPO: coralogix-operator-image
      IMG_TAG: 0.0.1
      CORALOGIX_REGION: EU2
      CORALOGIX_API_KEY: ${{ secrets.api_key }}
      AWS_REGION: ${{ secrets.aws_region }}
      LOGS_BUCKET: ${{ secrets.logs_bucket }}
      METRICS_BUCKET: ${{ secrets.metrics_bucket }}
      SLACK_INTEGRATION_CHANNEL: ${{ secrets.slack_channel }}
      # The service prepare-ci-team creates. The APM SLO specs fail in CI without it.
      CORALOGIX_SLO_APM_SERVICE: ci-acceptance-apm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0
      - name: Install Prometheus Operator CRDs
        run: |
          make install-prometheus-crds
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Add Coralogix Helm repository
        run: |
          helm repo add coralogix https://cgx.jfrog.io/artifactory/coralogix-charts-virtual
          helm repo update
      - name: Install Coralogix Operator from remote Helm repository, version ${{ inputs.operator_version }}.latest
        run: |
          helm install coralogix-operator coralogix/coralogix-operator \
            --version=${{ inputs.operator_version }} \
            --namespace coralogix-operator-system \
            --create-namespace \
            --set secret.data.apiKey="${{ secrets.api_key }}" \
            --set coralogixOperator.region="${{ env.CORALOGIX_REGION }}"
      - name: Create a ViewFolder with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-viewfolder.sh before
      - name: Create a DashboardsFolder with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-dashboardsfolder.sh before
      - name: Create a CustomRole with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-customrole.sh before
      # Chart 0.5 has no ArchiveLogsTarget.
      - name: Create an ArchiveLogsTarget with the released operator
        if: inputs.operator_version != '0.5'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-archivelogstarget.sh before
      - name: Create an AlertScheduler with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-alertscheduler.sh before
      - name: Create an Integration with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-integration.sh before
      - name: Create a Scope with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-scope.sh before
      - name: Create an ApiKey with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        # The key belongs to the team of the CI account, whose id the lookup exports.
        run: bash .github/scripts/ci-account.sh lookup bash scripts/upgrade-check-apikey.sh before
      - name: Create a View with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-view.sh before
      - name: Create a GlobalRouter with the released operator
        if: inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-globalrouter.sh before
      - name: Create a Preset with the released operator
        if: inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-preset.sh before
      - name: Create a Dashboard with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-dashboard.sh before
      # The Events2Metric name is also a metric name, which cannot have a dot, so its NAME has no "1.0".
      - name: Create an Events2Metric with the released operator
        if: inputs.operator_version != '0.5'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-events2metric.sh before
      # Each write of a TCO policies kind replaces every log or span policy of the team. The e2e tests
      # write the same lists, so these checks end before the e2e tests start. NAME is a policy name;
      # it has no dot, as for Events2Metric.
      - name: Create TCOLogsPolicies with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '0.5' && '0-5' || inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-tcologspolicies.sh before
      - name: Create TCOTracesPolicies with the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '0.5' && '0-5' || inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-tcotracespolicies.sh before
      # The SLO kind is in charts 2.0 and later.
      - name: Create an SLO with the released operator
        if: inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-slo.sh before
      - name: Build PR image
        uses: ./.github/actions/build-operator-image
        with:
          image: ${{ env.IMG_REPO }}:v${{ env.IMG_TAG }}
      - name: Load PR image into Kind
        run: |
          kind load docker-image ${{ env.IMG_REPO }}:v${{ env.IMG_TAG }} --name chart-testing
      - name: Upgrade to PR version
        run: |
          helm upgrade coralogix-operator ./charts/coralogix-operator \
            --namespace coralogix-operator-system \
            --set secret.data.apiKey="${{ secrets.api_key }}" \
            --set coralogixOperator.image.repository="${{ env.IMG_REPO }}" \
            --set coralogixOperator.image.tag="${{ env.IMG_TAG }}" \
            --set coralogixOperator.region="${{ env.CORALOGIX_REGION }}" \
            --set coralogixOperator.reconcileIntervalSeconds.scope=30 \
            --set coralogixOperator.reconcileIntervalSeconds.connector=30 \
            --set coralogixOperator.reconcileIntervalSeconds.ipAccess=30 \
            --set coralogixOperator.reconcileIntervalSeconds.archiveLogsTarget=30 \
            --set coralogixOperator.reconcileIntervalSeconds.archiveMetricsTarget=30
      # The old pod keeps the leader lease for a while after the upgrade. The checks of the TCO
      # policies kinds run before the e2e tests, so they wait for the new pod themselves.
      - name: Wait for the new operator to hold the leader lease
        run: |
          ns=coralogix-operator-system
          deploy="$(kubectl get deploy -n "$ns" -o name | head -1)"
          kubectl rollout status "$deploy" -n "$ns" --timeout=180s
          for _ in $(seq 1 90); do
            holder="$(kubectl get lease coralogix-operator -n "$ns" -o jsonpath='{.spec.holderIdentity}' 2>/dev/null || true)"
            pod="${holder%%_*}"
            if [ -n "$pod" ] && kubectl get pod "$pod" -n "$ns" -o jsonpath='{.spec.containers[0].image}' 2>/dev/null | grep -q "${{ env.IMG_REPO }}"; then
              exit 0
            fi
            sleep 2
          done
          echo "The new operator pod does not hold the leader lease."
          kubectl get lease coralogix-operator -n "$ns" -o yaml || true
          exit 1
      - name: Check the TCOLogsPolicies of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '0.5' && '0-5' || inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-tcologspolicies.sh after
      - name: Check the TCOTracesPolicies of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '0.5' && '0-5' || inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-tcotracespolicies.sh after
      - name: Delete the TCOLogsPolicies of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '0.5' && '0-5' || inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-tcologspolicies.sh cleanup
      - name: Delete the TCOTracesPolicies of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '0.5' && '0-5' || inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-tcotracespolicies.sh cleanup
      - name: Run e2e Tests
        env:
          # The generated AIEvaluation tests use the last AI application of the CI preparation.
          AI_EVALUATION_APPLICATION: ${{ secrets.ai_prefix }}-20
          AI_EVALUATION_SUBSYSTEM: ci-acceptance
        run: bash .github/scripts/ci-account.sh lookup make e2e-tests
      # After the e2e tests, which wait until the new operator holds the leader lease.
      - name: Check the ViewFolder of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-viewfolder.sh after
      - name: Check the DashboardsFolder of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-dashboardsfolder.sh after
      - name: Check the CustomRole of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-customrole.sh after
      - name: Check the ArchiveLogsTarget of the released operator
        if: inputs.operator_version != '0.5'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-archivelogstarget.sh after
      - name: Check the AlertScheduler of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-alertscheduler.sh after
      - name: Check the Integration of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-integration.sh after
      - name: Check the Scope of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-scope.sh after
      - name: Check the ApiKey of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash .github/scripts/ci-account.sh lookup bash scripts/upgrade-check-apikey.sh after
      - name: Check the View of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-view.sh after
      - name: Check the GlobalRouter of the released operator
        if: inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-globalrouter.sh after
      - name: Check the Preset of the released operator
        if: inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-preset.sh after
      - name: Check the Dashboard of the released operator
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-dashboard.sh after
      - name: Check the Events2Metric of the released operator
        if: inputs.operator_version != '0.5'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-events2metric.sh after
      - name: Check the SLO of the released operator
        if: inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-slo.sh after
      # A failed step before the check skips it, so delete the resources here; no run leaves them in
      # Coralogix.
      - name: Delete the SLO of the upgrade test
        if: always() && inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-slo.sh cleanup
      - name: Delete the Dashboard of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-dashboard.sh cleanup
      - name: Delete the Events2Metric of the upgrade test
        if: always() && inputs.operator_version != '0.5'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version == '1.0' && '1-0' || '2-0' }}
        run: bash scripts/upgrade-check-events2metric.sh cleanup
      - name: Delete the Preset of the upgrade test
        if: always() && inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-preset.sh cleanup
      - name: Delete the GlobalRouter of the upgrade test
        if: always() && inputs.operator_version == '2.0'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-globalrouter.sh cleanup
      - name: Delete the View of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-view.sh cleanup
      - name: Delete the ViewFolder of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-viewfolder.sh cleanup
      - name: Delete the DashboardsFolder of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-dashboardsfolder.sh cleanup
      - name: Delete the CustomRole of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-customrole.sh cleanup
      - name: Delete the ArchiveLogsTarget of the upgrade check
        if: always() && inputs.operator_version != '0.5'
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-archivelogstarget.sh cleanup
      - name: Delete the AlertScheduler of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-alertscheduler.sh cleanup
      - name: Delete the Integration of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-integration.sh cleanup
      - name: Delete the Scope of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash scripts/upgrade-check-scope.sh cleanup
      - name: Delete the ApiKey of the upgrade test
        if: always()
        env:
          NAME: upgrade-test-${{ github.run_id }}-${{ inputs.operator_version }}
        run: bash .github/scripts/ci-account.sh lookup bash scripts/upgrade-check-apikey.sh cleanup
      - name: Collect Operator Logs
        if: always()
        run: |
          scripts/collect-logs.sh

  group-scim-migration:
    name: Group SCIM to OpenAPI migration
    needs: check-suite
    if: ${{ inputs.suite == 'group-scim' && needs.check-suite.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      IMG_REPO: coralogix-operator-image
      IMG_TAG: 0.0.1
      CORALOGIX_REGION: EU2
      CORALOGIX_API_KEY: ${{ secrets.api_key }}
      E2E_PROCS: "1"
      E2E_GINKGO_LABEL_FILTER: scim-migration
      E2E_GROUP_SCIM_MIGRATION: "1"
      E2E_UPGRADE_IMAGE: coralogix-operator-image:v0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0
      - name: Install Prometheus Operator CRDs
        run: |
          make install-prometheus-crds
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Add Coralogix Helm repository
        run: |
          helm repo add coralogix https://cgx.jfrog.io/artifactory/coralogix-charts-virtual
          helm repo update
      - name: Install Helm chart 1.0
        run: |
          helm install coralogix-operator coralogix/coralogix-operator \
            --version=1.0 \
            --namespace coralogix-operator-system \
            --create-namespace \
            --set secret.data.apiKey="${{ secrets.api_key }}" \
            --set coralogixOperator.region="${{ env.CORALOGIX_REGION }}"
      - name: Build PR image
        uses: ./.github/actions/build-operator-image
        with:
          image: ${{ env.IMG_REPO }}:v${{ env.IMG_TAG }}
      - name: Load PR image into Kind
        run: |
          kind load docker-image ${{ env.IMG_REPO }}:v${{ env.IMG_TAG }} --name chart-testing
      - name: Run Group SCIM migration e2e
        env:
          # The generated AIEvaluation tests use the last AI application of the CI preparation.
          AI_EVALUATION_APPLICATION: ${{ secrets.ai_prefix }}-20
          AI_EVALUATION_SUBSYSTEM: ci-acceptance
        run: bash .github/scripts/ci-account.sh lookup make e2e-tests
      - name: Collect Operator Logs
        if: always()
        run: |
          scripts/collect-logs.sh
