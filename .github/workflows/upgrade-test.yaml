name: upgrade-test

on:
  schedule:
    - cron: 20 0 * * *
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*
    # No charts/** here on purpose: this job upgrades into the PR's chart, so chart changes are
    # exactly what it needs to cover.
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # Not cancel-in-progress: these specs create real Coralogix resources, and cleanup happens in
  # the suite's own teardown. Cancelling kills the Kind cluster before finalizers run, so the
  # remote resources leak and pollute the shared account. Let the old run finish and queue behind
  # it instead.
  cancel-in-progress: false

jobs:
  upgrade-test:
    name: Upgrade Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operator_version: [ "0.5", "1.0" ]
    env:
      IMG_REPO: coralogix-operator-image
      IMG_TAG: 0.0.1
      CORALOGIX_REGION: ${{ secrets.CORALOGIX_REGION }}
      CORALOGIX_API_KEY: ${{ secrets.CORALOGIX_API_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      LOGS_BUCKET: ${{ secrets.LOGS_BUCKET }}
      METRICS_BUCKET: ${{ secrets.METRICS_BUCKET }}
      SLACK_INTEGRATION_ID: ${{ secrets.SLACK_INTEGRATION_ID }}
      SLACK_INTEGRATION_CHANNEL: ${{ secrets.SLACK_INTEGRATION_CHANNEL }}
      PD_INTEGRATION_ID: ${{ secrets.PD_INTEGRATION_ID }}
      # Org-scoped key that may create/delete teams. When set, each matrix job provisions a
      # disposable team and runs fully inside it (see the "Provision an ephemeral Coralogix
      # team" step) — this also stops the two matrix jobs from clobbering each other. When
      # unset, the job keeps using the shared team from CORALOGIX_API_KEY as before.
      CORALOGIX_ORG_API_KEY: ${{ secrets.CORALOGIX_ORG_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache Makefile tool binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-tools-${{ github.workflow }}-${{ hashFiles('Makefile', 'go.sum') }}
      - name: Create Kind cluster
        uses: helm/kind-action@v1.4.0
      - name: Install Prometheus Operator CRDs
        run: |
          make install-prometheus-crds
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Add Coralogix Helm repository
        run: |
          helm repo add coralogix https://cgx.jfrog.io/artifactory/coralogix-charts-virtual
          helm repo update
      # Ephemeral-team isolation (opt-in): the e2e workflows all target one shared Coralogix
      # team, so concurrent runs clobber each other's team-wide singleton state (TCO policies,
      # archive targets, IP access, quota allocation rules, global router). When the
      # CORALOGIX_ORG_API_KEY secret is configured, provision a disposable team plus a
      # team-scoped API key and run this whole job against it. Without the secret this step is
      # skipped and the job keeps using the shared CORALOGIX_API_KEY secret exactly as before.
      - name: Provision an ephemeral Coralogix team
        if: env.CORALOGIX_ORG_API_KEY != ''
        run: |
          go run ./tests/ephemeralteam create > ephemeral-team.env
          # Mask the minted key BEFORE it is written to $GITHUB_ENV or any log.
          key="$(sed -n 's/^CORALOGIX_API_KEY=//p' ephemeral-team.env)"
          echo "::add-mask::$key"
          # Workflow-file env would shadow a GITHUB_ENV variable of the same name, so expose
          # the key under a distinct name; the steps that need it override CORALOGIX_API_KEY
          # at step level.
          echo "EPHEMERAL_CORALOGIX_API_KEY=$key" >> "$GITHUB_ENV"
          grep '^EPHEMERAL_TEAM_' ephemeral-team.env >> "$GITHUB_ENV"
          rm ephemeral-team.env
      - name: Install Coralogix Operator from remote Helm repository, version ${{ matrix.operator_version }}.latest
        env:
          # Prefer the ephemeral team's key; fall back to the shared team's secret.
          CORALOGIX_API_KEY: ${{ env.EPHEMERAL_CORALOGIX_API_KEY || secrets.CORALOGIX_API_KEY }}
        run: |
          helm install coralogix-operator coralogix/coralogix-operator \
            --version=${{ matrix.operator_version }} \
            --namespace coralogix-operator-system \
            --create-namespace \
            --set secret.data.apiKey="$CORALOGIX_API_KEY" \
            --set coralogixOperator.region="${{ secrets.CORALOGIX_REGION }}"
      - name: Build PR image
        uses: ./.github/actions/build-operator-image
        with:
          image: ${{ env.IMG_REPO }}:v${{ env.IMG_TAG }}
      - name: Load PR image into Kind
        run: |
          kind load docker-image ${{ env.IMG_REPO }}:v${{ env.IMG_TAG }} --name chart-testing
      - name: Upgrade to PR version
        env:
          # Prefer the ephemeral team's key; fall back to the shared team's secret.
          CORALOGIX_API_KEY: ${{ env.EPHEMERAL_CORALOGIX_API_KEY || secrets.CORALOGIX_API_KEY }}
        run: |
          helm upgrade coralogix-operator ./charts/coralogix-operator \
            --namespace coralogix-operator-system \
            --set secret.data.apiKey="$CORALOGIX_API_KEY" \
            --set coralogixOperator.image.repository="${{ env.IMG_REPO }}" \
            --set coralogixOperator.image.tag="${{ env.IMG_TAG }}" \
            --set coralogixOperator.region="${{ secrets.CORALOGIX_REGION }}" \
            --set coralogixOperator.reconcileIntervalSeconds.scope=30 \
            --set coralogixOperator.reconcileIntervalSeconds.connector=30 \
            --set coralogixOperator.reconcileIntervalSeconds.ipAccess=30 \
            --set coralogixOperator.reconcileIntervalSeconds.archiveLogsTarget=30 \
            --set coralogixOperator.reconcileIntervalSeconds.archiveMetricsTarget=30
      - name: Run e2e Tests
        env:
          # Prefer the ephemeral team's key; fall back to the shared team's secret.
          CORALOGIX_API_KEY: ${{ env.EPHEMERAL_CORALOGIX_API_KEY || secrets.CORALOGIX_API_KEY }}
        run: |
          make e2e-tests
      # Delete the ephemeral team only when everything passed. A failed run keeps the team so
      # its state can be inspected; leaked teams carry the cx-operator-e2e-ephemeral- name
      # prefix and can be swept by a scheduled cleanup.
      - name: Delete the ephemeral Coralogix team
        if: success() && env.EPHEMERAL_TEAM_ID != ''
        run: |
          go run ./tests/ephemeralteam delete "$EPHEMERAL_TEAM_ID"
      - name: Collect Operator Logs
        if: always()
        run: |
          scripts/collect-logs.sh

  notify-failure:
    name: Notify Slack on failure
    # Only scheduled (nightly) runs alert. Pull request and main/release push runs stay quiet.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs:
      - upgrade-test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Slack
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          # Slack incoming webhook URL, from the SLACK_CI_WEBHOOK_URL repository secret.
          # Keep the URL out of both the logs and the process list.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_CI_WEBHOOK_URL is not set; skipping the Slack notification."
            exit 0
          fi
          umask 077
          curl_config="$(mktemp)"
          trap 'rm -f "$curl_config"' EXIT
          printf 'url = "%s"\n' "$SLACK_WEBHOOK_URL" > "$curl_config"
          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success"))
            | map("• \(.key): \(.value.result)")
            | join("\n")
          ')
          jq -n \
            --arg repo "$REPOSITORY" \
            --arg ref "$REF_NAME" \
            --arg event "$EVENT_NAME" \
            --arg url "$RUN_URL" \
            --arg jobs "$failed_jobs" \
            '{
              text: ":rotating_light: Acceptance tests failed",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ":rotating_light: *Acceptance tests failed*\n*Repository:* \($repo)\n*Ref:* \($ref)\n*Trigger:* \($event)\n*Failed jobs:*\n\($jobs)\n<\($url)|View the workflow run>"
                  }
                }
              ]
            }' \
            | curl --config "$curl_config" \
                --fail --silent --show-error \
                --max-time 30 --retry 3 --retry-connrefused \
                --header 'Content-Type: application/json' \
                --data @- \
                --output /dev/null \
                --write-out 'Slack responded with HTTP %{http_code}\n'
