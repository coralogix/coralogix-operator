apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: events2metrics.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: Events2Metric
    listKind: Events2MetricList
    plural: events2metrics
    singular: events2metric
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              dataSource:
                type: string
              description:
                type: string
              metricFields:
                items:
                  properties:
                    aggregations:
                      items:
                        properties:
                          aggMetadata:
                            properties:
                              histogram:
                                properties:
                                  buckets:
                                    items:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                      x-kubernetes-int-or-string: true
                                    type: array
                                required:
                                - buckets
                                type: object
                              samples:
                                properties:
                                  sampleType:
                                    enum:
                                    - min
                                    - max
                                    type: string
                                required:
                                - sampleType
                                type: object
                            type: object
                            x-kubernetes-validations:
                            - message: At most one of samples, histogram can be set
                              rule: '(has(self.samples) ? 1 : 0) + (has(self.histogram)
                                ? 1 : 0) <= 1'
                          aggType:
                            enum:
                            - min
                            - max
                            - count
                            - avg
                            - sum
                            - histogram
                            - samples
                            type: string
                          enabled:
                            default: true
                            type: boolean
                          targetMetricName:
                            type: string
                        required:
                        - aggMetadata
                        - aggType
                        - enabled
                        - targetMetricName
                        type: object
                      type: array
                    sourceField:
                      type: string
                    targetBaseMetricName:
                      type: string
                  required:
                  - sourceField
                  - targetBaseMetricName
                  type: object
                type: array
              metricLabels:
                items:
                  properties:
                    sourceField:
                      type: string
                    targetLabel:
                      type: string
                  required:
                  - sourceField
                  - targetLabel
                  type: object
                type: array
              name:
                type: string
              permutationsLimit:
                format: int32
                type: integer
              query:
                properties:
                  logs:
                    properties:
                      alias:
                        type: string
                      applicationNameFilters:
                        items:
                          type: string
                        type: array
                      lucene:
                        type: string
                      severityFilters:
                        items:
                          enum:
                          - debug
                          - verbose
                          - info
                          - warn
                          - error
                          - critical
                          type: string
                        type: array
                      subsystemNameFilters:
                        items:
                          type: string
                        type: array
                    type: object
                  spans:
                    properties:
                      actionFilters:
                        items:
                          type: string
                        type: array
                      applicationNameFilters:
                        items:
                          type: string
                        type: array
                      lucene:
                        type: string
                      serviceFilters:
                        items:
                          type: string
                        type: array
                      subsystemNameFilters:
                        items:
                          type: string
                        type: array
                    type: object
                type: object
                x-kubernetes-validations:
                - message: Exactly one of spans, logs must be set
                  rule: '(has(self.spans) ? 1 : 0) + (has(self.logs) ? 1 : 0) == 1'
            required:
            - name
            - query
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
