apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dashboards.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: Dashboard
    listKind: DashboardList
    plural: dashboards
    singular: dashboard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              accessPolicy:
                type: string
              configMapRef:
                properties:
                  key:
                    type: string
                  name:
                    default: ""
                    type: string
                  optional:
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              folderRef:
                properties:
                  backendRef:
                    properties:
                      id:
                        type: string
                      path:
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: One of id or path is required
                      rule: has(self.id) || has(self.path)
                    - message: Only one of id or path can be declared at the same
                        time
                      rule: '!(has(self.id) && has(self.path))'
                  resourceRef:
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: One of backendRef or resourceRef is required
                  rule: has(self.backendRef) || has(self.resourceRef)
                - message: Only one of backendRef or resourceRef can be declared at
                    the same time
                  rule: '!(has(self.backendRef) && has(self.resourceRef))'
              gzipJson:
                format: byte
                type: string
              json:
                type: string
            type: object
            x-kubernetes-validations:
            - message: Only one of json or configMapRef can be declared at the same
                time
              rule: '!(has(self.json) && has(self.configMapRef))'
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              imported:
                type: boolean
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
