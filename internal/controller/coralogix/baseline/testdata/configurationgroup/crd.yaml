apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configurationgroups.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: ConfigurationGroup
    listKind: ConfigurationGroupList
    plural: configurationgroups
    singular: configurationgroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              description:
                maxLength: 4096
                type: string
              family:
                properties:
                  active:
                    type: boolean
                  description:
                    maxLength: 4096
                    type: string
                  preset:
                    properties:
                      chartName:
                        enum:
                        - CHART_NAME_OTEL_INTEGRATION
                        - CHART_NAME_OTEL_LINUX_STANDALONE
                        - CHART_NAME_OTEL_WINDOWS_STANDALONE
                        - CHART_NAME_OTEL_MACOS_STANDALONE
                        - CHART_NAME_OTEL_ECS_EC2
                        type: string
                      chartVersion:
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      integrationVersion:
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      metadata:
                        additionalProperties:
                          type: string
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
                        - message: metadata values must be at most 4096 characters
                          rule: self.all(k, size(self[k]) <= 4096)
                      observabilityFeatures:
                        maxLength: 1048576
                        minLength: 2
                        type: string
                    required:
                    - chartName
                    - chartVersion
                    - observabilityFeatures
                    type: object
                  raw:
                    properties:
                      collectorVersion:
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      metadata:
                        additionalProperties:
                          type: string
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
                        - message: metadata values must be at most 4096 characters
                          rule: self.all(k, size(self[k]) <= 4096)
                      remoteConfigurations:
                        items:
                          properties:
                            agentSelector:
                              properties:
                                attributes:
                                  additionalProperties:
                                    type: string
                                  type: object
                              type: object
                            name:
                              maxLength: 256
                              type: string
                            rawConfiguration:
                              maxLength: 1048576
                              minLength: 1
                              type: string
                          required:
                          - rawConfiguration
                          type: object
                        maxItems: 128
                        minItems: 1
                        type: array
                    required:
                    - remoteConfigurations
                    type: object
                type: object
                x-kubernetes-validations:
                - message: Exactly one of preset or raw is required
                  rule: has(self.preset) != has(self.raw)
              name:
                maxLength: 256
                minLength: 1
                type: string
              priorityOrder:
                format: int32
                maximum: 2147483647
                minimum: -2147483648
                type: integer
              tags:
                items:
                  maxLength: 256
                  type: string
                maxItems: 64
                type: array
            required:
            - family
            - name
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
