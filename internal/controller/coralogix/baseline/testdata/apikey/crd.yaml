apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apikeys.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: ApiKey
    listKind: ApiKeyList
    plural: apikeys
    singular: apikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              accessPolicy:
                type: string
              active:
                default: true
                type: boolean
              name:
                minLength: 0
                type: string
              owner:
                properties:
                  teamId:
                    format: int32
                    minimum: 0
                    type: integer
                  userId:
                    type: string
                type: object
                x-kubernetes-validations:
                - message: spec.owner is immutable
                  rule: self == oldSelf
                - message: Exactly one of teamId, userId must be set
                  rule: '(has(self.teamId) ? 1 : 0) + (has(self.userId) ? 1 : 0) ==
                    1'
              permissions:
                items:
                  type: string
                type: array
              presets:
                items:
                  type: string
                type: array
            required:
            - name
            - owner
            type: object
            x-kubernetes-validations:
            - message: At least one of presets or permissions must be set
              rule: has(self.presets) || has(self.permissions)
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
