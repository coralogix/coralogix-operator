apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: archivelogstargets.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: ArchiveLogsTarget
    listKind: ArchiveLogsTargetList
    plural: archivelogstargets
    singular: archivelogstarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              format:
                enum:
                - cxDataV1
                type: string
              ibmCosTarget:
                properties:
                  bucketCrn:
                    type: string
                  bucketType:
                    enum:
                    - UNSPECIFIED
                    - EXTERNAL
                    - INTERNAL
                    type: string
                  endpoint:
                    type: string
                  serviceCrn:
                    type: string
                type: object
              isActive:
                default: true
                type: boolean
              s3Target:
                properties:
                  bucketName:
                    type: string
                  externalId:
                    type: string
                  region:
                    type: string
                  roleArn:
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: Exactly one of s3Target or ibmCosTarget must be specified
              rule: has(self.s3Target) != has(self.ibmCosTarget)
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
