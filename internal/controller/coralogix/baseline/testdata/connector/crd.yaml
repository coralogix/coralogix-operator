apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: connectors.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: Connector
    listKind: ConnectorList
    plural: connectors
    singular: connector
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              configOverrides:
                items:
                  properties:
                    entityType:
                      enum:
                      - alerts
                      - cases
                      type: string
                    fields:
                      items:
                        properties:
                          fieldName:
                            type: string
                          template:
                            type: string
                          templateSecretKeyRef:
                            properties:
                              key:
                                type: string
                              name:
                                default: ""
                                type: string
                              optional:
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                        required:
                        - fieldName
                        type: object
                        x-kubernetes-validations:
                        - message: Exactly one of template or templateSecretKeyRef
                            must be set
                          rule: '(has(self.template) ? 1 : 0) + (has(self.templateSecretKeyRef)
                            ? 1 : 0) == 1'
                      type: array
                  required:
                  - entityType
                  type: object
                type: array
              connectorConfig:
                properties:
                  fields:
                    items:
                      properties:
                        fieldName:
                          type: string
                        secretKeyRef:
                          properties:
                            key:
                              type: string
                            name:
                              default: ""
                              type: string
                            optional:
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        value:
                          type: string
                      required:
                      - fieldName
                      type: object
                      x-kubernetes-validations:
                      - message: Exactly one of value or secretKeyRef must be set
                        rule: '(has(self.value) ? 1 : 0) + (has(self.secretKeyRef)
                          ? 1 : 0) == 1'
                    type: array
                required:
                - fields
                type: object
              description:
                type: string
              name:
                type: string
              type:
                enum:
                - slack
                - genericHttps
                - pagerDuty
                - pagerDutyIncidents
                - email
                - serviceNow
                - microsoftTeams
                - eventBridge
                - incidentIo
                type: string
            required:
            - connectorConfig
            - description
            - name
            - type
            type: object
          status:
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
